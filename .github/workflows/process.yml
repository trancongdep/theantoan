name: D-Office Processing

on:
  # Manual trigger from dashboard
  workflow_dispatch:
  
  # Scheduled: every 30 minutes during work hours (7am-5pm, Mon-Fri, GMT+7)
  schedule:
    - cron: '0,30 0-9 * * 1-5'  # 7:00, 7:30, ... 17:00 GMT+7 = 0,30 0-10 * * 1-5 UTC
  
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Playwright
      run: |
        npm install playwright
        npx playwright install --with-deps chromium
    
    - name: Run D-Office processor
      env:
        DOFFICE_USERNAME: ${{ secrets.DOFFICE_USERNAME }}
        DOFFICE_PASSWORD: ${{ secrets.DOFFICE_PASSWORD }}
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        GIST_ID: ${{ secrets.GIST_ID }}
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: node scripts/processor.js
    
    - name: Commit status.json
      run: |
        git config user.name "D-Office Bot"
        git config user.email "actions@github.com"
        git add status.json data.json
        git diff --staged --quiet || git commit -m "Auto: D-Office processing [skip ci]"
        git push
