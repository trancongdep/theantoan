<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đo Tiếng Ồn & Ánh Sáng (Lọc 5s)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">
  <header class="w-full max-w-md my-4 text-center">
    <h1 class="text-xl font-bold tracking-tight text-emerald-400">ĐO TIẾNG ỒN & ÁNH SÁNG</h1>
    <p class="text-xs text-slate-400 mt-1">Chế độ làm mượt: Lấy giá trị trung bình trong 5 giây</p>
  </header>

  <main class="w-full max-w-md space-y-4">
    <!-- KHỐI ĐO ĐỘ ỒN -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm font-semibold uppercase tracking-wider text-slate-300">Độ Ồn Môi Trường</span>
        <span id="noise-badge" class="text-xs px-2 py-0.5 rounded-full bg-slate-700 text-slate-300">Dừng</span>
      </div>

      <div class="text-center py-4">
        <div class="flex items-baseline justify-center gap-1">
          <span id="noise-val" class="text-6xl font-extrabold tracking-tight text-white">--</span>
          <span class="text-lg font-medium text-slate-400">dB</span>
        </div>
        <p id="noise-status" class="text-xs text-slate-400 mt-2">Chờ kích hoạt microphone</p>
      </div>

      <!-- Thanh tiến trình dB -->
      <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden mb-4">
        <div id="noise-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
      </div>

      <button id="btn-toggle-noise" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-98 text-white text-sm font-semibold rounded-xl transition">
        Bắt đầu đo ồn
      </button>
    </div>

    <!-- KHỐI ĐO ÁNH SÁNG -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm font-semibold uppercase tracking-wider text-slate-300">Cường Độ Ánh Sáng</span>
        <span id="light-badge" class="text-xs px-2 py-0.5 rounded-full bg-slate-700 text-slate-300">Dừng</span>
      </div>

      <div class="text-center py-4">
        <div class="flex items-baseline justify-center gap-1">
          <span id="light-val" class="text-6xl font-extrabold tracking-tight text-white">--</span>
          <span class="text-lg font-medium text-slate-400">Lux</span>
        </div>
        <p id="light-status" class="text-xs text-slate-400 mt-2">Chờ kích hoạt cảm biến/camera</p>
      </div>

      <!-- Thanh tiến trình Lux -->
      <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden mb-4">
        <div id="light-bar" class="bg-amber-500 h-full w-0 transition-all duration-300"></div>
      </div>

      <button id="btn-toggle-light" class="w-full py-3 bg-amber-600 hover:bg-amber-500 active:scale-98 text-white text-sm font-semibold rounded-xl transition">
        Bắt đầu đo sáng
      </button>
    </div>
  </main>

  <!-- Video ngầm dùng phân tích pixel khi không có AmbientLightSensor -->
  <video id="cam-feed" class="hidden" playsinline autoplay muted></video>
  <canvas id="cam-canvas" class="hidden" width="32" height="32"></canvas>

  <script>
    // --- LỚP BỘ ĐỆM TRUNG BÌNH THEO CỬA SỔ THỜI GIAN 5S ---
    class RollingAverage5s {
      constructor(windowMs = 5000) {
        this.windowMs = windowMs;
        this.samples = []; // Lưu cặp { time: timestamp, val: number }
      }

      add(val) {
        const now = performance.now();
        this.samples.push({ time: now, val: Number(val) });
        this.cleanup(now);
      }

      cleanup(now) {
        const cutoff = now - this.windowMs;
        // Loại bỏ các mẫu đã quá 5 giây trước đó
        while (this.samples.length > 0 && this.samples[0].time < cutoff) {
          this.samples.shift();
        }
      }

      getAverage() {
        this.cleanup(performance.now());
        if (this.samples.length === 0) return 0;
        const sum = this.samples.reduce((acc, cur) => acc + cur.val, 0);
        return sum / this.samples.length;
      }

      reset() {
        this.samples = [];
      }
    }

    // Khởi tạo 2 bộ lọc cho 2 thông số
    const noiseFilter = new RollingAverage5s(5000);
    const lightFilter = new RollingAverage5s(5000);

    // ==========================================
    // 1. MODULE ĐO TIẾNG ỒN (MICROPHONE)
    // ==========================================
    let audioCtx = null;
    let micStream = null;
    let noiseInterval = null;
    const btnToggleNoise = document.getElementById('btn-toggle-noise');
    const noiseValEl = document.getElementById('noise-val');
    const noiseBarEl = document.getElementById('noise-bar');
    const noiseBadgeEl = document.getElementById('noise-badge');
    const noiseStatusEl = document.getElementById('noise-status');

    async function toggleNoise() {
      if (micStream) {
        // Tắt đo
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
        if (audioCtx) await audioCtx.close();
        clearInterval(noiseInterval);
        noiseFilter.reset();

        btnToggleNoise.textContent = 'Bắt đầu đo ồn';
        btnToggleNoise.className = btnToggleNoise.className.replace('bg-rose-600 hover:bg-rose-500', 'bg-emerald-600 hover:bg-emerald-500');
        noiseBadgeEl.textContent = 'Dừng';
        noiseBadgeEl.className = 'text-xs px-2 py-0.5 rounded-full bg-slate-700 text-slate-300';
        noiseStatusEl.textContent = 'Đã dừng';
        return;
      }

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(micStream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        btnToggleNoise.textContent = 'Dừng đo ồn';
        btnToggleNoise.className = btnToggleNoise.className.replace('bg-emerald-600 hover:bg-emerald-500', 'bg-rose-600 hover:bg-rose-500');
        noiseBadgeEl.textContent = 'Đang đo (Avg 5s)';
        noiseBadgeEl.className = 'text-xs px-2 py-0.5 rounded-full bg-emerald-900 text-emerald-300 border border-emerald-700';
        noiseStatusEl.textContent = 'Đang tích lũy mẫu trong 5s...';

        // Lấy mẫu 20 lần/giây để đẩy vào cửa sổ trượt
        noiseInterval = setInterval(() => {
          analyser.getByteTimeDomainData(dataArray);

          // Tính RMS tức thời
          let sumSquares = 0;
          for (let i = 0; i < dataArray.length; i++) {
            const normalized = (dataArray[i] - 128) / 128;
            sumSquares += normalized * normalized;
          }
          const rms = Math.sqrt(sumSquares / dataArray.length);

          // Quy đổi xấp xỉ sang dB SPL (hiệu chuẩn gần đúng qua mic điện thoại/laptop)
          let instantDb = 20 * Math.log10(rms || 0.00001) + 90;
          instantDb = Math.max(30, Math.min(110, instantDb));

          // Đưa vào bộ lọc 5s
          noiseFilter.add(instantDb);
          const avgDb = Math.round(noiseFilter.getAverage());

          // Cập nhật giao diện
          noiseValEl.textContent = avgDb;
          const percent = Math.min(100, Math.max(0, ((avgDb - 30) / (100 - 30)) * 100));
          noiseBarEl.style.width = percent + '%';

          if (avgDb < 55) {
            noiseStatusEl.textContent = 'Yên tĩnh (Phù hợp học tập, làm việc)';
            noiseBarEl.className = 'bg-emerald-500 h-full transition-all duration-300';
          } else if (avgDb < 75) {
            noiseStatusEl.textContent = 'Bình thường (Văn phòng, trò chuyện)';
            noiseBarEl.className = 'bg-amber-500 h-full transition-all duration-300';
          } else {
            noiseStatusEl.textContent = 'Ồn cao (Cần chú ý giảm tiếng ồn)';
            noiseBarEl.className = 'bg-rose-500 h-full transition-all duration-300';
          }
        }, 50);

      } catch (err) {
        alert('Không thể mở microphone: ' + err.message);
      }
    }

    btnToggleNoise.addEventListener('click', toggleNoise);

    // ==========================================
    // 2. MODULE ĐO ÁNH SÁNG (SENSOR HOẶC CAMERA)
    // ==========================================
    let camStream = null;
    let lightInterval = null;
    let nativeSensor = null;
    const btnToggleLight = document.getElementById('btn-toggle-light');
    const lightValEl = document.getElementById('light-val');
    const lightBarEl = document.getElementById('light-bar');
    const lightBadgeEl = document.getElementById('light-badge');
    const lightStatusEl = document.getElementById('light-status');
    const video = document.getElementById('cam-feed');
    const canvas = document.getElementById('cam-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    async function toggleLight() {
      if (camStream || nativeSensor) {
        // Tắt đo
        if (camStream) {
          camStream.getTracks().forEach(t => t.stop());
          camStream = null;
        }
        if (nativeSensor) {
          nativeSensor.stop();
          nativeSensor = null;
        }
        clearInterval(lightInterval);
        lightFilter.reset();

        btnToggleLight.textContent = 'Bắt đầu đo sáng';
        btnToggleLight.className = btnToggleLight.className.replace('bg-rose-600 hover:bg-rose-500', 'bg-amber-600 hover:bg-amber-500');
        lightBadgeEl.textContent = 'Dừng';
        lightBadgeEl.className = 'text-xs px-2 py-0.5 rounded-full bg-slate-700 text-slate-300';
        lightStatusEl.textContent = 'Đã dừng';
        return;
      }

      btnToggleLight.textContent = 'Dừng đo sáng';
      btnToggleLight.className = btnToggleLight.className.replace('bg-amber-600 hover:bg-amber-500', 'bg-rose-600 hover:bg-rose-500');
      lightBadgeEl.textContent = 'Đang đo (Avg 5s)';
      lightBadgeEl.className = 'text-xs px-2 py-0.5 rounded-full bg-amber-900 text-amber-300 border border-amber-700';

      // Ưu tiên cảm biến AmbientLightSensor (Android Chrome bật flag)
      if ('AmbientLightSensor' in window) {
        try {
          nativeSensor = new AmbientLightSensor();
          nativeSensor.onreading = () => {
            lightFilter.add(nativeSensor.illuminance);
          };
          nativeSensor.start();
          lightStatusEl.textContent = 'Cảm biến phần cứng (Trung bình 5s)';
          startLightRenderLoop();
          return;
        } catch (e) {
          // Bị chặn quyền hoặc không có phần cứng -> chuyển sang camera fallback
        }
      }

      // Camera Fallback (Máy tính & iPhone)
      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 160 }, height: { ideal: 120 } },
          audio: false
        });
        video.srcObject = camStream;
        await video.play();

        lightStatusEl.textContent = 'Phân tích Camera (Trung bình 5s)';

        // Lấy mẫu ảnh 10 lần/giây để tính Luminance
        lightInterval = setInterval(() => {
          if (video.readyState >= 2) {
            ctx.drawImage(video, 0, 0, 32, 32);
            const frame = ctx.getImageData(0, 0, 32, 32).data;
            let sumLuma = 0;
            const totalPixels = frame.length / 4;

            for (let i = 0; i < frame.length; i += 4) {
              // Chuẩn BT.601: Y = 0.299R + 0.587G + 0.114B
              sumLuma += (frame[i] * 0.299 + frame[i + 1] * 0.587 + frame[i + 2] * 0.114);
            }
            const avgLuma = sumLuma / totalPixels; // [0..255]

            // Ước lượng phi tuyến sang thang đo Lux văn phòng (khoảng 0 - 1500 Lux)
            const estimatedLux = Math.pow(avgLuma / 255, 1.8) * 1200;
            lightFilter.add(estimatedLux);
          }
        }, 100);

        startLightRenderLoop();

      } catch (err) {
        alert('Không thể mở cảm biến/camera: ' + err.message);
        toggleLight();
      }
    }

    function startLightRenderLoop() {
      const render = () => {
        if (!camStream && !nativeSensor) return;
        const avgLux = Math.round(lightFilter.getAverage());
        lightValEl.textContent = avgLux;

        const percent = Math.min(100, (avgLux / 1000) * 100);
        lightBarEl.style.width = percent + '%';

        requestAnimationFrame(render);
      };
      requestAnimationFrame(render);
    }

    btnToggleLight.addEventListener('click', toggleLight);
  </script>
</body>
</html>
