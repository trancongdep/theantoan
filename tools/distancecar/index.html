<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADAS HUD - Auto Orientation</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: #000000;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* KHUNG CHỨA TOÀN BỘ BỐ CỤC */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            transition: all 0.3s ease;
        }

        /* --- BỐ CỤC MÀN HÌNH NGANG (LANDSCAPE) --- */
        @media (orientation: landscape) {
            .app-container {
                flex-direction: row;
            }
            .camera-panel {
                width: 50vw;
                height: 100vh;
                border-right: 2px solid #21262d;
                border-bottom: none;
            }
            .hud-panel {
                width: 50vw;
                height: 100vh;
            }
            .distance-value {
                font-size: clamp(60px, 11vw, 110px);
            }
        }

        /* --- BỐ CỤC MÀN HÌNH ĐỨNG (PORTRAIT) --- */
        @media (orientation: portrait) {
            .app-container {
                flex-direction: column;
            }
            .camera-panel {
                width: 100vw;
                height: 48vh;
                border-bottom: 2px solid #21262d;
                border-right: none;
            }
            .hud-panel {
                width: 100vw;
                height: 52vh;
            }
            .distance-value {
                font-size: clamp(56px, 14vw, 84px);
            }
        }

        /* KHUNG CAMERA (Ngang: Trái / Đứng: Trên) */
        .camera-panel {
            position: relative;
            background: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            z-index: 10;
        }
        .cam-overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #58a6ff;
            display: flex;
            gap: 8px;
        }

        /* KHUNG HUD (Ngang: Phải / Đứng: Dưới) */
        .hud-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px;
            background: #090d16;
            transition: background-color 0.25s, border-color 0.25s;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #8b949e;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
        }
        .gps-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f85149;
        }
        .dot.active {
            background: #2ea043;
            box-shadow: 0 0 8px #2ea043;
        }

        .btn-settings {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* KHU VỰC HIỂN THỊ KHOẢNG CÁCH CHỮ TO */
        .distance-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto 0;
        }
        .hud-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #8b949e;
            margin-bottom: 2px;
        }
        .distance-value {
            font-weight: 900;
            line-height: 0.95;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
            transition: color 0.2s ease;
        }
        .distance-unit {
            font-size: 26px;
            font-weight: 600;
            color: #8b949e;
            margin-left: 4px;
        }
        .target-type {
            margin-top: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #58a6ff;
        }

        /* KHU VỰC FOOTER THÔNG SỐ VẬN TỐC & QUY ĐỊNH */
        .hud-footer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid #21262d;
            padding-top: 8px;
        }
        .sub-metric {
            background: #161b22;
            padding: 8px 10px;
            border-radius: 8px;
            text-align: center;
        }
        .sub-label {
            font-size: 10px;
            color: #8b949e;
            text-transform: uppercase;
        }
        .sub-val {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
        }

        /* 3 CẤP ĐỘ CẢNH BÁO THEO THÔNG TƯ 31/2019 */
        .status-danger {
            background: #2b0b0e !important;
            border: 4px solid #f85149 !important;
        }
        .status-danger .distance-value { color: #f85149; }

        .status-warning {
            background: #2b2106 !important;
            border: 4px solid #d29922 !important;
        }
        .status-warning .distance-value { color: #d29922; }

        .status-safe {
            background: #090d16 !important;
            border: 4px solid #2ea043 !important;
        }
        .status-safe .distance-value { color: #2ea043; }

        /* MODAL CÀI ĐẶT */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }
        .modal-card h3 { margin-bottom: 10px; color: #58a6ff; font-size: 17px; }
        .modal-card label { font-size: 13px; color: #8b949e; display: block; margin-top: 8px; }
        .modal-card input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
        }
        .modal-actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }
        .btn-save {
            background: #238636;
            color: #fff;
            border: none;
            padding: 10px;
            flex: 1;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-close {
            background: #30363d;
            color: #c9d1d9;
            border: none;
            padding: 10px;
            flex: 1;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="camera-panel">
            <div class="cam-overlay-info">
                <span id="cam-status">Đang nạp AI...</span>
                <span id="tilt-status">Góc nghiêng: 0°</span>
            </div>
            <video id="webcam" playsinline autoplay muted></video>
            <canvas id="overlay"></canvas>
        </div>

        <div class="hud-panel" id="hud-panel">
            <div class="hud-header">
                <div class="gps-badge">
                    <span class="dot" id="gps-dot"></span>
                    <span id="gps-status">GPS Đang tìm...</span>
                </div>
                <button class="btn-settings" onclick="openSettings()">⚙️ FOV (<span id="fov-display-btn">55°</span>)</button>
            </div>

            <div class="distance-section">
                <div class="hud-label">KHOẢNG CÁCH XE TRƯỚC</div>
                <div class="distance-value" id="dist-display">--<span class="distance-unit">m</span></div>
                <div class="target-type" id="target-type">Đang quét phương tiện...</div>
            </div>

            <div class="hud-footer">
                <div class="sub-metric">
                    <div class="sub-label">VẬN TỐC XE (GPS)</div>
                    <div class="sub-val" id="speed-display">0 <span style="font-size: 12px; color:#8b949e;">km/h</span></div>
                </div>
                <div class="sub-metric">
                    <div class="sub-label">KC LUẬT ĐỊNH (TT31)</div>
                    <div class="sub-val" id="legal-req-display">35 <span style="font-size: 12px; color:#8b949e;">m</span></div>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-card">
            <h3>Cấu hình Camera FOV</h3>
            <p style="font-size: 12px; color: #8b949e;">Góc nhìn dọc camera. Tự động lưu trên máy.</p>
            
            <label>Góc FOV Dọc (độ):</label>
            <input type="number" id="input-fov" min="30" max="100" step="0.5" value="55">

            <div class="modal-actions">
                <button class="btn-close" onclick="closeSettings()">Hủy</button>
                <button class="btn-save" onclick="saveSettings()">Lưu cấu hình</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(console.error);
            });
        }

        // 2. Cài đặt biến cục bộ FOV
        let fovDegrees = parseFloat(localStorage.getItem('adas_camera_fov')) || 55.0;
        let phoneTiltPitch = 0;

        document.getElementById('fov-display-btn').innerText = `${fovDegrees}°`;
        document.getElementById('input-fov').value = fovDegrees;

        function openSettings() {
            document.getElementById('input-fov').value = fovDegrees;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveSettings() {
            const val = parseFloat(document.getElementById('input-fov').value);
            if (val >= 30 && val <= 100) {
                fovDegrees = val;
                localStorage.setItem('adas_camera_fov', fovDegrees);
                document.getElementById('fov-display-btn').innerText = `${fovDegrees}°`;
                closeSettings();
            } else {
                alert("Giá trị FOV không hợp lệ (30° - 100°)");
            }
        }

        // 3. Tự động đọc cảm biến góc nghiêng phù hợp theo hướng màn hình
        function initSensors() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    const isLandscape = window.matchMedia("(orientation: landscape)").matches;
                    // Khi để ngang, trục pitch được lấy từ gamma; khi để đứng, lấy từ beta
                    let rawPitch = isLandscape ? event.gamma : event.beta;
                    
                    if (rawPitch !== null) {
                        // Tính góc lệch khỏi phương thẳng đứng 90 độ
                        phoneTiltPitch = Math.abs(Math.abs(rawPitch) - (isLandscape ? 0 : 90));
                        document.getElementById('tilt-status').innerText = `Nghiêng: ${Math.round(phoneTiltPitch)}°`;
                    }
                });
            }
        }

        // Cập nhật lại kích thước Canvas khi người dùng xoay màn hình
        window.addEventListener('resize', () => {
            if (video.videoWidth && video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
        });

        // 4. Khởi động AI & Camera & GPS
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const camStatus = document.getElementById('cam-status');
        const hudPanel = document.getElementById('hud-panel');
        const distDisplay = document.getElementById('dist-display');
        const targetType = document.getElementById('target-type');
        const speedDisplay = document.getElementById('speed-display');
        const legalReqDisplay = document.getElementById('legal-req-display');
        const gpsDot = document.getElementById('gps-dot');
        const gpsStatus = document.getElementById('gps-status');

        let model = null;
        let currentSpeedKmh = 0;

        const VEHICLE_SPECS = {
            'car':        { height: 1.55, width: 1.78, label: 'Ô TÔ CON' },
            'truck':      { height: 2.80, width: 2.30, label: 'XE TẢI' },
            'bus':        { height: 3.20, width: 2.50, label: 'XE BUÝT' },
            'motorcycle': { height: 1.15, width: 0.75, label: 'XE MÁY' }
        };

        function getLegalDistance(speed) {
            if (speed <= 60) return 35;
            if (speed <= 80) return 55;
            if (speed <= 100) return 70;
            return 100;
        }

        function initGPS() {
            if (!("geolocation" in navigator)) {
                gpsStatus.innerText = "GPS không hỗ trợ";
                return;
            }

            navigator.geolocation.watchPosition(
                (pos) => {
                    gpsDot.className = "dot active";
                    gpsStatus.innerText = "GPS Chuẩn";

                    if (pos.coords.speed !== null && pos.coords.speed >= 0) {
                        currentSpeedKmh = Math.round(pos.coords.speed * 3.6);
                    } else {
                        currentSpeedKmh = 0;
                    }

                    speedDisplay.innerHTML = `${currentSpeedKmh} <span style="font-size: 12px; color:#8b949e;">km/h</span>`;
                    legalReqDisplay.innerHTML = `${getLegalDistance(currentSpeedKmh)} <span style="font-size: 12px; color:#8b949e;">m</span>`;
                },
                (err) => {
                    gpsDot.className = "dot";
                    gpsStatus.innerText = "Mất GPS";
                },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        async function startSystem() {
            initGPS();
            initSensors();
            try {
                model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                camStatus.innerText = "AI Sẵn sàng";
                
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    requestAnimationFrame(renderLoop);
                };
            } catch (err) {
                camStatus.innerText = "Lỗi: " + err.message;
            }
        }

        async function renderLoop() {
            if (!model || video.readyState !== 4) {
                requestAnimationFrame(renderLoop);
                return;
            }

            const predictions = await model.detect(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const fovRad = fovDegrees * (Math.PI / 180);
            const focalLengthPx = (canvas.height / 2) / Math.tan(fovRad / 2);

            let nearestVehicle = null;
            let minDistance = Infinity;

            predictions.forEach(pred => {
                const className = pred.class.toLowerCase();
                const spec = VEHICLE_SPECS[className];

                if (spec && pred.score > 0.40) {
                    const [x, y, w, h] = pred.bbox;

                    const distH = (focalLengthPx * spec.height) / h;
                    const distW = (focalLengthPx * spec.width) / w;
                    let d = (distW * 0.6) + (distH * 0.4);

                    // Bù sai số phối cảnh từ cảm biến con quay hồi chuyển
                    if (phoneTiltPitch > 5 && phoneTiltPitch < 45) {
                        const tiltRad = phoneTiltPitch * (Math.PI / 180);
                        d = d * Math.cos(tiltRad);
                    }

                    if (d < minDistance) {
                        minDistance = d;
                        nearestVehicle = {
                            label: spec.label,
                            score: pred.score,
                            bbox: [x, y, w, h],
                            distance: d
                        };
                    }

                    // Khung mờ các xe ở xa
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(x, y, w, h);
                }
            });

            // Đánh giá cấp độ an toàn theo Thông tư 31/2019/TT-BGTVT
            const legalDist = getLegalDistance(currentSpeedKmh);

            if (nearestVehicle && minDistance < 120) {
                const [nx, ny, nw, nh] = nearestVehicle.bbox;
                const d = nearestVehicle.distance;

                let stateClass = '';
                let boxColor = '';

                // Cấp độ 1: Đỏ (Gần hơn quy định - 5m)
                if (d < (legalDist - 5)) {
                    stateClass = 'status-danger';
                    boxColor = '#f85149';
                } 
                // Cấp độ 2: Vàng (Trong khoảng quy định +- 5m)
                else if (d <= (legalDist + 5)) {
                    stateClass = 'status-warning';
                    boxColor = '#d29922';
                } 
                // Cấp độ 3: Xanh (> Quy định + 5m)
                else {
                    stateClass = 'status-safe';
                    boxColor = '#2ea043';
                }

                ctx.strokeStyle = boxColor;
                ctx.lineWidth = 4;
                ctx.strokeRect(nx, ny, nw, nh);

                hudPanel.className = `hud-panel ${stateClass}`;
                distDisplay.innerHTML = `${d.toFixed(1)}<span class="distance-unit">m</span>`;
                targetType.innerText = `${nearestVehicle.label} (${Math.round(nearestVehicle.score * 100)}%)`;

            } else {
                hudPanel.className = 'hud-panel';
                distDisplay.innerHTML = `--<span class="distance-unit">m</span>`;
                targetType.innerText = "Không có vật cản";
            }

            requestAnimationFrame(renderLoop);
        }

        window.onload = startSystem;
    </script>
</body>
</html>
