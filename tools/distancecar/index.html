<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AUTODO ADAS - Cảnh Báo Khoảng Cách Xe</title>

    <!-- CẤU HÌNH PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">

    <!-- Nạp TensorFlow.js & COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            background: #000000;
            color: #ffffff;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            transition: all 0.2s ease;
        }

        /* BỐ CỤC NGANG */
        .layout-landscape { flex-direction: row !important; }
        .layout-landscape .camera-panel { width: 50vw; height: 100%; border-right: 2px solid #21262d; border-bottom: none; }
        .layout-landscape .hud-panel { width: 50vw; height: 100%; }
        .layout-landscape .distance-value { font-size: clamp(60px, 12vw, 110px); }

        /* BỐ CỤC ĐỨNG */
        .layout-portrait { flex-direction: column !important; }
        .layout-portrait .camera-panel { width: 100vw; height: 46%; border-bottom: 2px solid #21262d; border-right: none; }
        .layout-portrait .hud-panel { width: 100vw; height: 54%; }
        .layout-portrait .distance-value { font-size: clamp(54px, 14vw, 84px); }

        /* CAMERA */
        .camera-panel {
            position: relative;
            background: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas { z-index: 10; }
        .cam-overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #58a6ff;
            display: flex;
            gap: 8px;
        }

        /* HUD PANEL CHÍNH */
        .hud-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 16px;
            background: #090d16;
            transition: background-color 0.25s, border-color 0.25s;
        }

        /* HEADER HUD */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #8b949e;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
            gap: 6px;
        }
        .brand-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #00e676;
            font-size: 14px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #f85149; }
        .dot.active { background: #00e676; box-shadow: 0 0 8px #00e676; }

        .header-actions { display: flex; gap: 6px; }
        .btn-ctrl {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 6px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-ctrl.active-voice {
            background: #1f6feb;
            color: #fff;
            border-color: #388bfd;
        }
        .btn-ctrl:active { background: #30363d; }

        /* KHU VỰC KHOẢNG CÁCH AUTODO */
        .distance-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto 0;
            position: relative;
        }

        /* ICON CẢNH BÁO TAM GIÁC */
        .warning-triangle {
            font-size: 32px;
            color: #f85149;
            margin-bottom: 4px;
            display: none;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 0.2; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.1); }
        }

        .hud-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #8b949e;
            margin-bottom: 2px;
        }
        .distance-value {
            font-weight: 900;
            line-height: 0.95;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
            transition: color 0.2s ease;
        }
        .distance-unit { font-size: 26px; font-weight: 600; color: #8b949e; margin-left: 4px; }
        
        .target-meta {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .target-type { font-size: 14px; font-weight: 600; color: #58a6ff; }
        .lane-status-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-in-lane { background: #238636; color: #fff; }
        .badge-out-lane { background: #30363d; color: #8b949e; }

        /* FOOTER: VẬN TỐC & MỨC AN TOÀN */
        .hud-footer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid #21262d;
            padding-top: 8px;
        }
        .sub-metric { background: #161b22; padding: 8px 10px; border-radius: 8px; text-align: center; }
        .sub-label { font-size: 10px; color: #8b949e; text-transform: uppercase; }
        .sub-val { font-size: 22px; font-weight: 800; color: #ffffff; }

        /* CẢNH BÁO 3 CẤP ĐỘ */
        .status-danger {
            background: #341217 !important;
            border: 4px solid #f85149 !important;
        }
        .status-danger .distance-value { color: #f85149; }
        .status-danger .warning-triangle { display: block; }

        .status-warning {
            background: #2e240b !important;
            border: 4px solid #d29922 !important;
        }
        .status-warning .distance-value { color: #d29922; }

        .status-safe {
            background: #090d16 !important;
            border: 4px solid #2ea043 !important;
        }
        .status-safe .distance-value { color: #2ea043; }

        /* MODAL CÀI ĐẶT */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 20px;
            border-radius: 12px;
            width: 92%;
            max-width: 400px;
        }
        .modal-card h3 { margin-bottom: 12px; color: #58a6ff; font-size: 17px; }
        .setting-group { margin-bottom: 14px; }
        .setting-group label { font-size: 13px; color: #8b949e; display: block; margin-bottom: 6px; }
        .modal-card input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 6px 0;
        }
        .checkbox-row input { width: 18px; height: 18px; cursor: pointer; }
        .checkbox-row span { font-size: 14px; font-weight: 500; color: #c9d1d9; }
        .modal-actions { margin-top: 18px; display: flex; gap: 10px; }
        .btn-save { background: #238636; color: #fff; border: none; padding: 10px; flex: 1; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-close { background: #30363d; color: #c9d1d9; border: none; padding: 10px; flex: 1; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container layout-landscape" id="main-container">
        <!-- CỘT TRÁI: CAMERA THỰC -->
        <div class="camera-panel">
            <div class="cam-overlay-info">
                <span id="cam-status">Đang nạp AI...</span>
                <span id="tilt-status">Nghiêng: 0°</span>
            </div>
            <video id="webcam" playsinline autoplay muted></video>
            <canvas id="overlay"></canvas>
        </div>

        <!-- CỘT PHẢI: HUD AUTODO -->
        <div class="hud-panel" id="hud-panel">
            <div class="hud-header">
                <div class="brand-badge">
                    <span class="dot" id="gps-dot"></span>
                    <span>AUTODO</span>
                </div>
                
                <div class="header-actions">
                    <!-- Bật/Tắt Giọng Nói & Âm Thanh Cảnh Báo -->
                    <button class="btn-ctrl active-voice" onclick="toggleVoiceAlert()" id="btn-voice" title="Bật/Tắt Cảnh Báo Giọng Nói">
                        🔊 <span id="voice-label">Bật</span>
                    </button>
                    <!-- Xoay Màn Hình -->
                    <button class="btn-ctrl" onclick="toggleOrientationMode()" id="btn-rotate">
                        🔄 <span id="rotate-label">Ngang</span>
                    </button>
                    <!-- Toàn Màn Hình -->
                    <button class="btn-ctrl" onclick="toggleFullScreen()">
                        ⛶
                    </button>
                    <!-- Cài Đặt -->
                    <button class="btn-ctrl" onclick="openSettings()">⚙️</button>
                </div>
            </div>

            <!-- HIỂN THỊ KHOẢNG CÁCH CHÍNH -->
            <div class="distance-section">
                <div class="warning-triangle">⚠️</div>
                <div class="hud-label">KHOẢNG CÁCH XE TRƯỚC</div>
                <div class="distance-value" id="dist-display">--<span class="distance-unit">m</span></div>
                <div class="target-meta">
                    <div class="target-type" id="target-type">Đang quét phương tiện...</div>
                    <div id="lane-badge" style="display: none;"></div>
                </div>
            </div>

            <!-- THÔNG SỐ VẬN TỐC & QUY ĐỊNH TT31 -->
            <div class="hud-footer">
                <div class="sub-metric">
                    <div class="sub-label">VẬN TỐC (GPS)</div>
                    <div class="sub-val" id="speed-display">0 <span style="font-size: 11px; color:#8b949e;">km/h</span></div>
                </div>
                <div class="sub-metric">
                    <div class="sub-label">KC AN TOÀN (TT31)</div>
                    <div class="sub-val" id="legal-req-display">35 <span style="font-size: 11px; color:#8b949e;">m</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CÀI ĐẶT -->
    <div id="settings-modal">
        <div class="modal-card">
            <h3>Cài đặt AutoDo ADAS</h3>
            
            <div class="setting-group">
                <label>Góc FOV Dọc camera (độ):</label>
                <input type="number" id="input-fov" min="30" max="100" step="0.5" value="55">
            </div>

            <div class="setting-group">
                <label class="checkbox-row">
                    <input type="checkbox" id="check-ignore-motorcycle">
                    <span>Bỏ qua xe máy (Chỉ bắt Ô tô/Tải/Buýt)</span>
                </label>
            </div>

            <div class="setting-group">
                <label class="checkbox-row">
                    <input type="checkbox" id="check-only-in-lane">
                    <span>Chỉ bắt xe CÙNG LÀN ĐƯỜNG</span>
                </label>
            </div>

            <div class="modal-actions">
                <button class="btn-close" onclick="closeSettings()">Hủy</button>
                <button class="btn-save" onclick="saveSettings()">Lưu cấu hình</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. HỆ THỐNG ÂM THANH & GIỌNG NÓI CẢNH BÁO (AUDIO / SPEECH SYNTHESIS) ---
        let voiceEnabled = localStorage.getItem('adas_voice_enabled') !== 'false';
        let lastAlertTime = 0;
        const ALERT_COOLDOWN_MS = 3500; // Giãn cách 3.5 giây giữa các lần đọc cảnh báo
        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Phát tiếng bíp cảnh báo điện tử
        function playWarningBeep() {
            if (!voiceEnabled) return;
            try {
                initAudioContext();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz (Nốt La cao)
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) {}
        }

        // Đọc giọng nói cảnh báo tiếng Việt: "Cảnh báo! Khoảng cách quá gần."
        function triggerVoiceWarning() {
            if (!voiceEnabled) return;
            const now = performance.now();
            if (now - lastAlertTime < ALERT_COOLDOWN_MS) return; // Tránh đọc đè liên tục
            lastAlertTime = now;

            playWarningBeep();

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Hủy các câu đọc dở trước đó
                const msg = new SpeechSynthesisUtterance("Cảnh báo! Khoảng cách quá gần");
                msg.lang = 'vi-VN';
                msg.rate = 1.1; // Đọc nhanh dứt khoát
                msg.pitch = 1.0;
                window.speechSynthesis.speak(msg);
            }
        }

        function toggleVoiceAlert() {
            initAudioContext();
            voiceEnabled = !voiceEnabled;
            localStorage.setItem('adas_voice_enabled', voiceEnabled);
            const btn = document.getElementById('btn-voice');
            const label = document.getElementById('voice-label');
            if (voiceEnabled) {
                btn.className = 'btn-ctrl active-voice';
                btn.innerHTML = '🔊 <span id="voice-label">Bật</span>';
            } else {
                btn.className = 'btn-ctrl';
                btn.innerHTML = '🔇 <span id="voice-label">Tắt</span>';
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            }
        }

        // --- 2. QUẢN LÝ CẤU HÌNH (LOCAL STORAGE) ---
        let fovDegrees = parseFloat(localStorage.getItem('adas_camera_fov')) || 55.0;
        let ignoreMotorcycle = localStorage.getItem('adas_ignore_motorcycle') === 'true';
        let onlyInLane = localStorage.getItem('adas_only_in_lane') === 'true';
        let phoneTiltPitch = 0;

        function openSettings() {
            document.getElementById('input-fov').value = fovDegrees;
            document.getElementById('check-ignore-motorcycle').checked = ignoreMotorcycle;
            document.getElementById('check-only-in-lane').checked = onlyInLane;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveSettings() {
            const val = parseFloat(document.getElementById('input-fov').value);
            if (val >= 30 && val <= 100) {
                fovDegrees = val;
                ignoreMotorcycle = document.getElementById('check-ignore-motorcycle').checked;
                onlyInLane = document.getElementById('check-only-in-lane').checked;

                localStorage.setItem('adas_camera_fov', fovDegrees);
                localStorage.setItem('adas_ignore_motorcycle', ignoreMotorcycle);
                localStorage.setItem('adas_only_in_lane', onlyInLane);

                closeSettings();
            } else {
                alert("Giá trị FOV không hợp lệ (30° - 100°)");
            }
        }

        // --- 3. XOAY MÀN HÌNH & TOÀN MÀN HÌNH ---
        let currentMode = 'landscape';
        const mainContainer = document.getElementById('main-container');
        const rotateLabel = document.getElementById('rotate-label');

        function setOrientationMode(mode) {
            currentMode = mode;
            if (mode === 'landscape') {
                mainContainer.className = 'app-container layout-landscape';
                rotateLabel.innerText = "Ngang";
            } else {
                mainContainer.className = 'app-container layout-portrait';
                rotateLabel.innerText = "Đứng";
            }
            resizeCanvas();
        }

        function toggleOrientationMode() {
            setOrientationMode(currentMode === 'landscape' ? 'portrait' : 'landscape');
        }

        function toggleFullScreen() {
            initAudioContext();
            const doc = window.document;
            const docEl = doc.documentElement;
            const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen;
            const exit = doc.exitFullscreen || doc.webkitExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement) {
                if (req) req.call(docEl);
            } else {
                if (exit) exit.call(doc);
            }
        }

        // --- 4. CẢM BIẾN & GPS ---
        function initSensors() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    const isLandscape = (currentMode === 'landscape');
                    let rawPitch = isLandscape ? event.gamma : event.beta;
                    if (rawPitch !== null) {
                        phoneTiltPitch = Math.abs(Math.abs(rawPitch) - (isLandscape ? 0 : 90));
                        document.getElementById('tilt-status').innerText = `Nghiêng: ${Math.round(phoneTiltPitch)}°`;
                    }
                });
            }
        }

        const gpsDot = document.getElementById('gps-dot');
        const speedDisplay = document.getElementById('speed-display');
        const legalReqDisplay = document.getElementById('legal-req-display');
        let currentSpeedKmh = 0;

        // Bảng quy định chuẩn theo Thông tư 31/2019/TT-BGTVT
        function getLegalDistance(speed) {
            if (speed <= 60) return 35;
            if (speed <= 80) return 55;
            if (speed <= 100) return 70;
            return 100;
        }

        function initGPS() {
            if (!("geolocation" in navigator)) return;
            navigator.geolocation.watchPosition(
                (pos) => {
                    gpsDot.className = "dot active";
                    currentSpeedKmh = (pos.coords.speed !== null && pos.coords.speed >= 0) ? Math.round(pos.coords.speed * 3.6) : 0;
                    speedDisplay.innerHTML = `${currentSpeedKmh} <span style="font-size: 11px; color:#8b949e;">km/h</span>`;
                    legalReqDisplay.innerHTML = `${getLegalDistance(currentSpeedKmh)} <span style="font-size: 11px; color:#8b949e;">m</span>`;
                },
                () => { gpsDot.className = "dot"; },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        // --- 5. TÍNH TOÁN CÙNG LÀN ĐƯỜNG ---
        function checkIfInLane(bbox, frameWidth, frameHeight) {
            const [x, y, w, h] = bbox;
            const centerX = x + (w / 2);
            const bottomY = y + h;
            const imageCenterX = frameWidth / 2;
            const offsetFromCenter = Math.abs(centerX - imageCenterX);
            const depthRatio = Math.min(1.0, Math.max(0.1, bottomY / frameHeight));
            const laneHalfWidthAtDepth = frameWidth * (0.10 + 0.28 * depthRatio);
            return offsetFromCenter <= laneHalfWidthAtDepth;
        }

        // --- 6. AI & VÒNG LẶP XỬ LÝ ---
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const camStatus = document.getElementById('cam-status');
        const hudPanel = document.getElementById('hud-panel');
        const distDisplay = document.getElementById('dist-display');
        const targetType = document.getElementById('target-type');
        const laneBadge = document.getElementById('lane-badge');

        let model = null;

        const VEHICLE_SPECS = {
            'car':        { height: 1.55, width: 1.78, label: 'Ô TÔ CON' },
            'truck':      { height: 2.80, width: 2.30, label: 'XE TẢI' },
            'bus':        { height: 3.20, width: 2.50, label: 'XE BUÝT' },
            'motorcycle': { height: 1.15, width: 0.75, label: 'XE MÁY' }
        };

        function resizeCanvas() {
            if (video.videoWidth && video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
        }
        window.addEventListener('resize', resizeCanvas);

        async function startSystem() {
            initGPS();
            initSensors();
            setOrientationMode(window.innerWidth < window.innerHeight ? 'portrait' : 'landscape');

            try {
                model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                camStatus.innerText = "AutoDo AI Sẵn sàng";

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });

                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    resizeCanvas();
                    requestAnimationFrame(renderLoop);
                };
            } catch (err) {
                camStatus.innerText = "Lỗi: " + err.message;
            }
        }

        async function renderLoop() {
            if (!model || video.readyState !== 4) {
                requestAnimationFrame(renderLoop);
                return;
            }

            const predictions = await model.detect(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const fovRad = fovDegrees * (Math.PI / 180);
            const focalLengthPx = (canvas.height / 2) / Math.tan(fovRad / 2);

            drawLaneCorridor(canvas.width, canvas.height);

            let nearestVehicle = null;
            let minDistance = Infinity;

            predictions.forEach(pred => {
                const className = pred.class.toLowerCase();
                if (ignoreMotorcycle && className === 'motorcycle') return;

                const spec = VEHICLE_SPECS[className];
                if (spec && pred.score > 0.40) {
                    const [x, y, w, h] = pred.bbox;
                    const isInLane = checkIfInLane(pred.bbox, canvas.width, canvas.height);

                    if (onlyInLane && !isInLane) {
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x, y, w, h);
                        return;
                    }

                    const distH = (focalLengthPx * spec.height) / h;
                    const distW = (focalLengthPx * spec.width) / w;
                    let d = (distW * 0.6) + (distH * 0.4);

                    if (phoneTiltPitch > 5 && phoneTiltPitch < 45) {
                        d = d * Math.cos(phoneTiltPitch * (Math.PI / 180));
                    }

                    if (d < minDistance) {
                        minDistance = d;
                        nearestVehicle = {
                            label: spec.label,
                            score: pred.score,
                            bbox: [x, y, w, h],
                            distance: d,
                            isInLane: isInLane
                        };
                    }

                    ctx.strokeStyle = isInLane ? 'rgba(0, 230, 118, 0.4)' : 'rgba(255, 255, 255, 0.25)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(x, y, w, h);
                }
            });

            // ĐÁNH GIÁ CẢNH BÁO AUTODO & PHÁT ÂM THANH
            const legalDist = getLegalDistance(currentSpeedKmh);

            if (nearestVehicle && minDistance < 120) {
                const [nx, ny, nw, nh] = nearestVehicle.bbox;
                const d = nearestVehicle.distance;

                let stateClass = '';
                let boxColor = '';

                // 1. Cấp độ ĐỎ: Cự ly < Mức luật định (Phát cảnh báo khẩn cấp + Giọng nói)
                if (d < legalDist) {
                    stateClass = 'status-danger';
                    boxColor = '#f85149';
                    
                    // Chỉ phát giọng nói khi xe đang chạy (vận tốc > 15 km/h) và xe mục tiêu cùng làn
                    if (currentSpeedKmh >= 15 && nearestVehicle.isInLane) {
                        triggerVoiceWarning();
                    }
                } 
                // 2. Cấp độ VÀNG: Cảnh báo sớm (Early Warning) dưới mức an toàn + 5m
                else if (d <= (legalDist + 5)) {
                    stateClass = 'status-warning';
                    boxColor = '#d29922';
                } 
                // 3. Cấp độ XANH: Cự ly an toàn
                else {
                    stateClass = 'status-safe';
                    boxColor = '#2ea043';
                }

                ctx.strokeStyle = boxColor;
                ctx.lineWidth = 4;
                ctx.strokeRect(nx, ny, nw, nh);

                hudPanel.className = `hud-panel ${stateClass}`;
                distDisplay.innerHTML = `${d.toFixed(1)}<span class="distance-unit">m</span>`;
                targetType.innerText = `${nearestVehicle.label} (${Math.round(nearestVehicle.score * 100)}%)`;

                laneBadge.style.display = 'block';
                if (nearestVehicle.isInLane) {
                    laneBadge.className = 'lane-status-badge badge-in-lane';
                    laneBadge.innerText = '● CÙNG LÀN XE';
                } else {
                    laneBadge.className = 'lane-status-badge badge-out-lane';
                    laneBadge.innerText = '○ KHÁC LÀN (BÊN CẠNH)';
                }

            } else {
                hudPanel.className = 'hud-panel';
                distDisplay.innerHTML = `--<span class="distance-unit">m</span>`;
                targetType.innerText = "Không có vật cản";
                laneBadge.style.display = 'none';
            }

            requestAnimationFrame(renderLoop);
        }

        function drawLaneCorridor(w, h) {
            ctx.save();
            ctx.strokeStyle = 'rgba(88, 166, 255, 0.2)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 6]);

            ctx.beginPath();
            ctx.moveTo(w * 0.40, h * 0.45);
            ctx.lineTo(w * 0.12, h);
            ctx.moveTo(w * 0.60, h * 0.45);
            ctx.lineTo(w * 0.88, h);
            ctx.stroke();

            ctx.restore();
        }

        window.onload = startSystem;
    </script>
</body>
</html>
