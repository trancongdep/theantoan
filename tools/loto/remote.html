<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LOTO Remote Controller</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; }
        .controller-screen { display: none; padding: 15px; }
        .controller-screen.active { display: block; }
        .grid-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .btn-tool { background: #222; border: 2px solid #444; border-radius: 8px; color: #fff; padding: 15px 5px; font-size: 0.8rem; }
        .btn-tool.selected { border-color: #00a8ff; background: rgba(0,168,255,0.2); }
        .btn-execute { background: #e84118; color: white; width: 100%; padding: 20px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 50px; margin-top: 20px; box-shadow: 0 0 15px #e84118; }
        .btn-execute:active { transform: scale(0.95); background: #c23616; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP PHÒNG -->
    <div id="view-join" class="controller-screen active" style="padding-top: 50px;">
        <h2>THẾ AN TOÀN REMOTE</h2>
        <input type="number" id="room-pin" placeholder="Nhập mã PIN phòng (VD: 8899)" style="padding: 12px; font-size: 1.1rem; width: 80%; border-radius: 8px; text-align: center;"><br><br>
        <input type="text" id="student-name" placeholder="Họ và Tên của bạn" style="padding: 12px; font-size: 1.1rem; width: 80%; border-radius: 8px; text-align: center;"><br><br>
        <button onclick="joinRoom()" style="padding: 12px 30px; font-size: 1rem; background: #00a8ff; border: none; border-radius: 8px; color: white; font-weight: bold;">VÀO PHÒNG</button>
    </div>

    <!-- MÀN HÌNH CHỜ LƯỢT -->
    <div id="view-wait" class="controller-screen" style="padding-top: 80px;">
        <div style="font-size: 3rem;">⏳</div>
        <h3>BẠN ĐANG TRONG PHÒNG CHỜ</h3>
        <p style="color: #aaa;">Hãy chú ý màn hình máy chiếu.<br>Giảng viên sẽ chỉ định bạn thực hiện thao tác.</p>
    </div>

    <!-- MÀN HÌNH REMOTE ĐIỀU KHIỂN (KHI ĐƯỢC CHỈ ĐỊNH) -->
    <div id="view-remote" class="controller-screen">
        <div style="font-size: 0.8rem; color: #4cd137; margin-bottom: 5px;">● ĐANG TRAO QUYỀN THAO TÁC</div>
        <h3 id="current-task-text" style="margin: 0 0 10px 0; color: #f1c40f;">BƯỚC: CẮT ĐIỆN VÀ KHÓA LOTO</h3>
        
        <p style="font-size: 0.8rem; text-align: left; margin: 5px 0;">1. Chọn dụng cụ:</p>
        <div class="grid-tools">
            <button class="btn-tool" onclick="pickTool('lock')">🔒<br>Ổ Khóa</button>
            <button class="btn-tool" onclick="pickTool('tag')">🏷️<br>Thẻ Báo</button>
            <button class="btn-tool" onclick="pickTool('hasp')">🔗<br>Hasp</button>
            <button class="btn-tool" onclick="pickTool('meter')">⚡<br>VOM</button>
            <button class="btn-tool" onclick="pickTool('earth_earth')">⏚<br>Đất</button>
            <button class="btn-tool" onclick="pickTool('earth_phase')">⚡<br>Pha</button>
        </div>

        <p style="font-size: 0.8rem; text-align: left; margin: 5px 0;">2. Chọn thiết bị thao tác:</p>
        <select id="target-device" style="width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #555; border-radius: 8px;">
            <option value="CB1">Máy cắt / CB-1</option>
            <option value="CB2">Máy cắt / CB-2 (Mục tiêu)</option>
            <option value="MOTOR_M2">Động cơ / Quạt M2</option>
        </select>

        <button class="btn-execute" onclick="sendActionToHost()">XÁC NHẬN THỰC HIỆN</button>
    </div>

    <script>
        // CẤU HÌNH FIREBASE PROJECT THEANTOAN
        const firebaseConfig = {
            apiKey: "AIzaSyCkBRre5ajocg0EIuOchb6QknsdL6Qq9FA",
            databaseURL: "https://theantoan-fea9e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "theantoan-fea9e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let roomPin = "", myStudentId = "", selectedTool = "";

        function joinRoom() {
            roomPin = document.getElementById('room-pin').value.trim();
            const name = document.getElementById('student-name').value.trim();
            if(!roomPin || !name) return alert("Vui lòng nhập đủ PIN và Tên!");

            myStudentId = "HV_" + Date.now().toString().slice(-4);
            
            // Đăng ký vào phòng
            db.ref(`practice_rooms/ROOM_${roomPin}/students/${myStudentId}`).set({
                name: name,
                online: true
            });

            // Lắng nghe lệnh từ Giảng viên
            db.ref(`practice_rooms/ROOM_${roomPin}/config`).on('value', (snap) => {
                const cfg = snap.val();
                if(cfg && cfg.active_student_id === myStudentId) {
                    showView('view-remote');
                    if(navigator.vibrate) navigator.vibrate(200);
                } else {
                    showView('view-wait');
                }
            });
        }

        function pickTool(tool) {
            selectedTool = tool;
            document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
        }

        function sendActionToHost() {
            if(!selectedTool) return alert("Vui lòng chọn 1 dụng cụ!");
            const target = document.getElementById('target-device').value;

            // Gửi dữ liệu điều khiển lên phòng của Giảng viên
            db.ref(`practice_rooms/ROOM_${roomPin}/controller_input`).set({
                student_id: myStudentId,
                tool: selectedTool,
                target: target,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            alert("Đã gửi thao tác lên màn hình giảng viên!");
        }

        function showView(id) {
            document.querySelectorAll('.controller-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
