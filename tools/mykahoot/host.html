<script>
// --- AUDIO ENGINE (TỔNG HỢP ÂM THANH BẰNG WEB AUDIO API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let tickInterval = null;

function playTone(freq, duration, type='sine', gain=0.1) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(gain, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playTickSound() {
    playTone(800, 0.05, 'triangle', 0.04);
}

function startCountdownAudio() {
    clearInterval(tickInterval);
    tickInterval = setInterval(playTickSound, 1000);
}

function stopCountdownAudio() {
    clearInterval(tickInterval);
}

function playResultFanfare() {
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
        setTimeout(() => playTone(f, 0.4, 'triangle', 0.15), i * 120);
    });
}

        { text: "Theo Kim tự tháp tỷ lệ tai nạn Heinrich, đằng sau 1 vụ tai nạn chết người/chấn thương nặng thì có bao nhiêu hành vi và điều kiện không an toàn tiềm ẩn?", opts: ["300", "3.000", "30.000", "300.000"], ans: 2, explain: "Tỷ lệ chuẩn Heinrich là 1 tử vong : 30 nặng : 300 nhẹ : 3.000 suýt : 30.000 vi phạm." },

        { text: "Theo QCVN 24:2016/BYT, mức ồn tối đa cho phép tại nơi làm việc trong ca lao động 8 giờ liên tục là bao nhiêu dB?", opts: ["75 dB", "80 dB", "85 dB", "90 dB"], ans: 2, explain: "Quy chuẩn vệ sinh lao động giới hạn 8 giờ là 85 dBA." }

    p4: [
        { text: "Theo Tháp 5 cấp độ kiểm soát rủi ro, biện pháp nào mang lại hiệu quả an toàn cao nhất và bền vững nhất?", opts: ["Trang bị đồ bảo hộ cá nhân (PPE) cao cấp nhất", "Huấn luyện quy trình an toàn (Biện pháp hành chính)", "Lắp đặt rào chắn, biển báo (Kiểm soát kỹ thuật)", "Loại bỏ hoàn toàn mối nguy từ gốc (Elimination)"], ans: 3, explain: "Loại bỏ mối nguy luôn là biện pháp triệt để nhất tại gốc rễ." },

let activeQuestions = prebuiltQuizzes['p1'];
const ROOM = "FPT_" + Math.floor(1000 + Math.random() * 9000);
document.getElementById('room-id').innerText = ROOM;

function onQuizChange() {
    const val = document.getElementById('quiz-select').value;
    const uploadBox = document.getElementById('file-upload-box');
    if (val === 'custom') {
        uploadBox.classList.remove('hidden');
    } else {
        uploadBox.classList.add('hidden');
        activeQuestions = prebuiltQuizzes[val];
        document.getElementById('quiz-summary').innerText = `Đã chọn: ${activeQuestions.length} câu hỏi sẵn sàng.`;
    }
}
onQuizChange();

// --- PARSER TỰ ĐỘNG BÓC TÁCH FILE WORD (.DOCX) AZOTA ---
function parseDocx(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        mammoth.extractRawText({arrayBuffer: e.target.result})
        .then(function(result) {
            const text = result.value;
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let parsed = [];
            let curQ = null;
            lines.forEach(line => {
                if (/^Câu\s+\d+[\.:]/i.test(line)) {
                    if (curQ && curQ.opts.length >= 2) parsed.push(curQ);
                    curQ = { text: line.replace(/^Câu\s+\d+[\.:]\s*/i, ''), opts: [], ans: 0, explain: '' };
                } else if (/^[A-D]\.\s*/.test(line) && curQ) {
                    curQ.opts.push(line.replace(/^[A-D]\.\s*/, ''));
                } else if (/^Lời giải:/i.test(line) && curQ) {
                    curQ.explain = line.replace(/^Lời giải:\s*/i, '');
                }
            });
            if (curQ && curQ.opts.length >= 2) parsed.push(curQ);
            
            if (parsed.length > 0) {
                activeQuestions = parsed;
                document.getElementById('quiz-summary').innerText = `✓ Đã nạp thành công ${parsed.length} câu hỏi từ file Word!`;
            } else {
                alert("Không thể bóc tách câu hỏi. Hãy chắc chắn file Word có cấu trúc: 'Câu 1.', 'A.', 'B.', 'Lời giải:'");
            }
        });
    };
    reader.readAsArrayBuffer(file);
}

// --- MQTT NETWORKING ---
let currentQ = 0;
let players = {};
let timer = null;
let timeLeft = 0;
let answeredCount = 0;

const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
const topicBase = "fpt_hse_quiz/" + ROOM;

client.on('connect', () => {
    client.subscribe(topicBase + "/join");
    client.subscribe(topicBase + "/answer");
});

// Sinh mã QR dẫn sang trang play.html
const studentURL = window.location.href.replace('host.html', 'play.html') + "?room=" + ROOM;
new QRCode(document.getElementById("qrcode"), { text: studentURL, width: 210, height: 210 });

client.on('message', (topic, message) => {
    const data = JSON.parse(message.toString());
    if (topic.endsWith('/join')) {
        if (!players[data.id]) {
            players[data.id] = { name: data.name, score: 0, lastAns: -1 };
            updatePlayerCount();
        }
    } else if (topic.endsWith('/answer')) {
        if (players[data.id] && players[data.id].lastAns === -1) {
            players[data.id].lastAns = data.opt;
            answeredCount++;
            updateSubmitCounter();
            if (data.opt === activeQuestions[currentQ].ans) {
                const totalTime = parseInt(document.getElementById('time-select').value);
                const score = Math.round(500 + (data.time / totalTime) * 500);
                players[data.id].score += score;
            }
            // Nếu tất cả đã nộp bài thì kết thúc sớm câu hỏi
            if (answeredCount >= Object.keys(players).length && Object.keys(players).length > 0) {
                clearInterval(timer);
                stopCountdownAudio();
                showAnswerResult();
            }
        }
    }
});

function updatePlayerCount() {
    document.getElementById('player-count').innerText = Object.keys(players).length;
    updateSubmitCounter();
}

function updateSubmitCounter() {
    const total = Object.keys(players).length;
    document.getElementById('submit-counter').innerText = `Đã nộp: ${answeredCount} / ${total}`;
}

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
}

function startQuiz() {
    document.getElementById('lobby-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    loadQuestion(0);
}

function loadQuestion(idx) {
    currentQ = idx;
    answeredCount = 0;
    const q = activeQuestions[idx];
    const totalTime = parseInt(document.getElementById('time-select').value);
    
    document.getElementById('q-counter').innerText = `Câu ${idx + 1}/${activeQuestions.length}`;
    document.getElementById('q-text').innerText = q.text;
    document.getElementById('explain-box').innerText = '';
    document.getElementById('next-btn').classList.add('hidden');
    updateSubmitCounter();
    
    Object.keys(players).forEach(id => { players[id].lastAns = -1; });

    let optHtml = '';
    q.opts.forEach((opt, i) => {
        optHtml += `<div class="opt-card opt-${i}" id="opt-box-${i}">${['▲','◆','●','■'][i]} ${opt}</div>`;
    });
    document.getElementById('options-container').innerHTML = optHtml;

    // Phát lệnh cho điện thoại học viên
    client.publish(topicBase + "/question", JSON.stringify({
        qIndex: idx,
        text: q.text,
        opts: q.opts,
        time: totalTime
    }));

    // Bắt đầu đếm ngược & bật âm thanh
    timeLeft = totalTime;
    document.getElementById('time-left').innerText = timeLeft + 's';
    const bar = document.getElementById('progress-bar');
    bar.style.transition = 'none';
    bar.style.width = '100%';
    setTimeout(() => {
        bar.style.transition = `width ${totalTime}s linear`;
        bar.style.width = '0%';
    }, 50);

    startCountdownAudio();
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft + 's';
        if (timeLeft <= 0) {
            clearInterval(timer);
            stopCountdownAudio();
            showAnswerResult();
        }
    }, 1000);
}

function showAnswerResult() {
    stopCountdownAudio();
    playResultFanfare();
    const q = activeQuestions[currentQ];
    
    // Nổi bật đáp án đúng
    const box = document.getElementById(`opt-box-${q.ans}`);
    if (box) box.classList.add('correct-mark');
    if (q.explain) {
        document.getElementById('explain-box').innerText = "💡 " + q.explain;
    }

    client.publish(topicBase + "/result", JSON.stringify({ correct: q.ans }));
    document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
    if (currentQ < activeQuestions.length - 1) {
        showLeaderboard();
    } else {
        showFinalLeaderboard();
    }
}

function showLeaderboard() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('leaderboard-screen').classList.remove('hidden');
    renderRanking();
}

function renderRanking() {
    const sorted = Object.values(players).sort((a, b) => b.score - a.score).slice(0, 5);
    let rows = '';
    sorted.forEach((p, idx) => {
        rows += `<tr><td>#${idx + 1}</td><td>${p.name}</td><td><strong>${p.score}</strong> pts</td></tr>`;
    });
    document.getElementById('leaderboard-body').innerHTML = rows || '<tr><td colspan="3">Chưa có kết quả</td></tr>';
}

function returnToQuiz() {
    document.getElementById('leaderboard-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    loadQuestion(currentQ + 1);
}

function showFinalLeaderboard() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('leaderboard-screen').classList.remove('hidden');
    document.querySelector('#leaderboard-screen h1').innerText = "🏆 CHUNG CUỘC: VINH DANH QUÁN QUÂN 🏆";
    renderRanking();
    document.getElementById('finish-btn').classList.add('hidden');
}
</script>
</body>
</html>
