    <style>

        .btn-open:hover { background: #1d4ed8; }

        /* GIAI ĐOẠN 2: SẢNH CHỜ */
        .lobby-layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 25px; margin-top: 15px; align-items: start; }

        .badge { background: #0284c7; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 16px; display: inline-block; margin-bottom: 10px; }
        .btn-start { width: 100%; background: #10b981; color: #fff; border: none; padding: 15px; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }

        .lobby-right { background: #0f172a; padding: 18px; border-radius: 16px; border: 1px solid #334155; text-align: left; height: 460px; display: flex; flex-direction: column; }
        .player-list-header { font-size: 16px; font-weight: bold; color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; }

        .player-chip { background: #334155; color: #f8fafc; padding: 6px 12px; border-radius: 16px; font-size: 13px; border: 1px solid #475569; }

        .timer-bar { width: 100%; height: 12px; background: #334155; border-radius: 6px; overflow: hidden; margin: 15px 0; }
        .timer-progress { width: 100%; height: 100%; background: #ef4444; }
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; text-align: left; }
        .opt-card { padding: 20px; border-radius: 12px; font-size: 18px; font-weight: bold; line-height: 1.4; }
        .opt-0 { background: #dc2626; } .opt-1 { background: #2563eb; } .opt-2 { background: #d97706; } .opt-3 { background: #16a34a; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }

<body>

<!-- GIAI ĐOẠN 1: SETUP THÔNG TIN & CHỌN ĐỀ -->
<div class="box" id="phase1-screen">
    <button class="fs-btn" onclick="toggleFullScreen()">⛶ Toàn màn hình</button>
    
    <!-- THANH XÁC THỰC GMAIL -->
    <div class="header-auth">

            <img id="user-avatar" src="" alt="">

            </div>
        </div>
        <div id="auth-logged-out">
            <span style="font-size: 13px; color:#cbd5e1;">Đăng nhập để lưu đề riêng: </span>

                <option value="p3">Phần 3: Nhận diện yếu tố nguy hiểm, có hại (4 câu)</option>
                <option value="p4">Phần 4: Kiểm soát rủi ro & Bradley (3 câu)</option>

            <p id="quiz-status" style="margin-top: 8px; color: #10b981; font-size: 13px;">✓ Đã nạp 4 câu hỏi sẵn sàng.</p>

        <div class="panel">

            <div style="margin-top: 15px;">

            </div>
        </div>
    </div>

    <button class="btn-open" onclick="goToLobby()">MỞ PHÒNG THI ➔</button>
</div>

<!-- GIAI ĐOẠN 2: SẢNH CHỜ THI ĐẤU -->
<div class="box hidden" id="phase2-screen">
    <button class="fs-btn" onclick="toggleFullScreen()">⛶ Toàn màn hình</button>
    <h1 id="lobby-title" style="margin-bottom: 4px;">TIÊU ĐỀ CUỘC THI</h1>
    <div style="text-align: center; margin-bottom: 15px;">
        <span class="badge">Phòng thi: <span id="room-id-display"></span></span>
    </div>

    <div class="lobby-layout">
        <div class="lobby-left">
            <div id="qrcode"></div>
            <p style="font-size: 14px; color: #94a3b8; margin-bottom: 10px;">Học viên quét mã để vào đấu trường</p>
            <div style="font-size: 20px; margin-bottom: 15px;">
                Số học viên đã vào: <span id="player-count" style="color:#10b981; font-weight:bold; font-size:26px;">0</span>
            </div>
            <button class="btn-start" onclick="startQuiz()">BẮT ĐẦU CUỘC THI</button>
        </div>

        <div class="lobby-right">
            <div class="player-list-header">
                <span>Danh sách học viên</span>
                <span id="list-count" style="color:#f59e0b;">(0)</span>

            <div class="player-list-scroll" id="player-chips"></div>
        </div>
    </div>
</div>

<!-- MÀN HÌNH THI ĐẤU -->
<div class="box hidden" id="quiz-screen">
    <button class="fs-btn" onclick="toggleFullScreen()">⛶ Toàn màn hình</button>
    <div class="live-status">
        <span class="badge" id="q-counter">Câu 1/4</span>
        <span class="badge" style="background:#0d9488;" id="submit-counter">Đã nộp: 0 / 0</span>
        <span class="badge" style="background:#ef4444;" id="time-left">30s</span>
    </div>
    <h2 id="q-text" style="font-size: 21px; margin: 15px 0; min-height: 50px; line-height: 1.4; text-align: left;"></h2>
    <div class="timer-bar"><div class="timer-progress" id="progress-bar"></div></div>
    <div class="grid-options" id="options-container"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
        <div id="explain-box" style="text-align: left; color: #cbd5e1; font-style: italic; max-width: 75%;"></div>
        <button class="btn-start hidden" style="width: auto; padding: 10px 24px;" id="next-btn" onclick="nextQuestion()">CÂU TIẾP ➔</button>
    </div>
</div>

<!-- BẢNG XẾP HẠNG LEADERBOARD -->
<div class="box hidden" id="leaderboard-screen">
    <button class="fs-btn" onclick="toggleFullScreen()">⛶ Toàn màn hình</button>
    <h1>🏆 BẢNG XẾP HẠNG TOP THI ĐẤU 🏆</h1>
    <table>
        <thead><tr><th>Hạng</th><th>Tên học viên</th><th>Điểm số</th></tr></thead>
        <tbody id="leaderboard-body"></tbody>
    </table>
    <div style="margin-top: 20px; text-align: center;">
        <button class="btn-start" style="width: auto; padding: 10px 24px;" id="finish-btn" onclick="returnToQuiz()">TIẾP TỤC</button>
    </div>
</div>

<script>
// --- 1. FIREBASE AUTHENTICATION RÚT GỌN ---
const firebaseConfig = {

    storageBucket: "theantoan-fea9e.firebasestorage.app",

    appId: "1:161371447668:web:3f3c2f9c0b967ace91cc21",
    measurementId: "G-G5R89QH44C"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUid = null;

auth.onAuthStateChanged(user => {
    if (user) {
        currentUid = user.uid;
        document.getElementById('auth-logged-out').classList.add('hidden');
        document.getElementById('btn-login').classList.add('hidden');
        document.getElementById('auth-logged-in').classList.remove('hidden');
        document.getElementById('btn-logout').classList.remove('hidden');
        document.getElementById('user-name').innerText = user.displayName;
        document.getElementById('user-email').innerText = user.email;
        document.getElementById('user-avatar').src = user.photoURL;
        loadSavedQuizzes(user.uid);
    } else {
        currentUid = null;
        document.getElementById('auth-logged-out').classList.remove('hidden');
        document.getElementById('btn-login').classList.remove('hidden');
        document.getElementById('auth-logged-in').classList.add('hidden');
        document.getElementById('btn-logout').classList.add('hidden');
    }
});

function loginGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e => alert("Lỗi đăng nhập: " + e.message));
}
function logoutGoogle() { auth.signOut(); }

    p2: [
        { text: "Tại chi nhánh, phòng giao dịch FPT Telecom, tần suất tự kiểm tra ATVSLĐ toàn diện cấp cơ sở tối thiểu là bao lâu?", opts: ["01 lần trong 03 tháng", "01 lần trong 06 tháng", "Ít nhất 01 lần trong 01 năm", "02 năm một lần khi có kiểm toán"], ans: 2, explain: "Cơ sở thông thường tự kiểm tra toàn diện ít nhất 1 lần/năm." },

        { text: "Theo Tháp 5 cấp độ kiểm soát rủi ro, biện pháp nào mang lại hiệu quả an toàn cao nhất và bền vững nhất?", opts: ["Trang bị đồ bảo hộ cá nhân (PPE) cao cấp nhất", "Huấn luyện quy trình an toàn (Biện pháp hành chính)", "Lắp đặt rào chắn, biển báo (Kiểm soát kỹ thuật)", "Loại bỏ hoàn toàn mối nguy từ gốc (Elimination)"], ans: 3, explain: "Loại bỏ mối nguy khỏi nơi làm việc luôn là tầng bảo vệ cao nhất." },
        { text: "Cấp độ Văn hóa An toàn Tương tác/Đồng đội (Interdependent) theo mô hình Bradley thể hiện qua hành động nào dưới đây?", opts: ["Chỉ tuân thủ quy định khi có mặt cán bộ giám sát kiểm tra", "Làm an toàn để bản thân không bị trừ lương, phạt tiền", "Chủ động bảo vệ chính mình và nhắc nhở, ngăn chặn đồng đội khi thấy nguy cơ mất an toàn", "Xem an toàn là trách nhiệm riêng của bộ phận chuyên trách HSE"], ans: 2, explain: "Văn hóa tương tác thể hiện ở việc các đồng đội chủ động hỗ trợ, bảo vệ lẫn nhau." },
        { text: "Khi thấy thợ kéo cáp đối tác TIN làm việc trên cột điện nhưng không thắt đai an toàn, hành động chuẩn mực đầu tiên của Quản lý đối tác là gì?", opts: ["Chờ hết ca làm việc rồi về văn phòng lập biên bản phạt tiền", "Lập tức yêu cầu tạm dừng thi công, đưa công nhân xuống vị trí an toàn và chấn chỉnh bảo hộ", "Bỏ qua vì đây là nhân sự thuộc công ty thầu ngoài", "Chụp ảnh gửi lên nhóm chat chung"], ans: 1, explain: "Ngăn chặn ngay hành vi mất an toàn là trách nhiệm bảo toàn tính mạng số 1." }
    ]
};

let activeQuestions = BUILTIN_QUIZZES['p1'];
const ROOM = "FPT_" + Math.random().toString(36).substring(2, 7).toUpperCase();
document.getElementById('room-code').innerText = ROOM;

function onQuizPick() {
    const val = document.getElementById('quiz-picker').value;
    if (val === 'upload') {
        document.getElementById('upload-box').classList.remove('hidden');
    } else {
        document.getElementById('upload-box').classList.add('hidden');
        if (BUILTIN_QUIZZES[val]) {
            activeQuestions = BUILTIN_QUIZZES[val];
            document.getElementById('quiz-status').innerText = `✓ Đã nạp ${activeQuestions.length} câu hỏi sẵn sàng.`;
        }
    }
}

// Bóc tách Markdown (<10ms)
function parseMarkdownFast(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const lines = e.target.result.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let parsed = [];
        let curQ = null;
        lines.forEach(line => {
            if (line.startsWith('# ')) {
                document.getElementById('quiz-title-input').value = line.replace('# ', '').trim();
            } else if (/^Câu\s+\d+[\.:]/i.test(line)) {
                if (curQ && curQ.opts.length >= 2) parsed.push(curQ);
                curQ = { text: line.replace(/^Câu\s+\d+[\.:]\s*/i, ''), opts: [], ans: 0, explain: '' };
            } else if (/^(\*?[A-D])\.\s*(.+)/.test(line) && curQ) {
                const match = line.match(/^(\*?[A-D])\.\s*(.+)/);
                if (match[1].startsWith('*')) curQ.ans = curQ.opts.length;
                curQ.opts.push(match[2]);
            } else if (/^Lời giải:/i.test(line) && curQ) {
                curQ.explain = line.replace(/^Lời giải:\s*/i, '');
            }
        });
        if (curQ && curQ.opts.length >= 2) parsed.push(curQ);

        if (parsed.length > 0) {
            activeQuestions = parsed;
            document.getElementById('quiz-status').innerText = `✓ Đã nạp thành công ${parsed.length} câu hỏi siêu tốc!`;
            // Lưu lên Firestore cho riêng tài khoản này nếu đã đăng nhập
            if (currentUid) {
                db.collection("users").doc(currentUid).collection("quizzes").add({
                    title: document.getElementById('quiz-title-input').value,
                    questions: parsed
                });
            }
        }
    };
    reader.readAsText(file, "UTF-8");
}

function loadSavedQuizzes(uid) {
    db.collection("users").doc(uid).collection("quizzes").get().then(snap => {
        if (!snap.empty) {
            const picker = document.getElementById('quiz-picker');
            snap.forEach(doc => {
                const d = doc.data();
                const opt = document.createElement('option');
                opt.value = "custom_" + doc.id;
                opt.innerText = "[Riêng] " + d.title + ` (${d.questions.length} câu)`;
                BUILTIN_QUIZZES[opt.value] = d.questions;
                picker.insertBefore(opt, picker.lastElementChild);
            });
        }
    });
}

// --- 3. ĐIỀU KHIỂN SẢNH CHỜ & MQTT ---
let currentQ = 0;
let players = {};
let timer = null;
let timeLeft = 0;
let answeredCount = 0;
let client = null;
const topicBase = "fpt_hse_quiz/" + ROOM;

function goToLobby() {
    document.getElementById('lobby-title').innerText = document.getElementById('quiz-title-input').value;
    document.getElementById('room-id-display').innerText = ROOM;
    document.getElementById('phase1-screen').classList.add('hidden');
    document.getElementById('phase2-screen').classList.remove('hidden');

    // Sinh mã QR dẫn học viên vào play.html
    const studentURL = window.location.href.replace('host.html', 'play.html') + "?room=" + ROOM;
    const qrContainer = document.getElementById("qrcode");
    qrContainer.innerHTML = '';
    new QRCode(qrContainer, { text: studentURL, width: 250, height: 250 });

    // Kích hoạt Broker MQTT công cộng (WSS)
    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    client.on('connect', () => {
        client.subscribe(topicBase + "/join");
        client.subscribe(topicBase + "/answer");
    });

    client.on('message', (topic, message) => {
        const data = JSON.parse(message.toString());
        if (topic.endsWith('/join')) {
            if (!players[data.id]) {
                players[data.id] = { name: data.name, score: 0, lastAns: -1 };
                const count = Object.keys(players).length;
                document.getElementById('player-count').innerText = count;
                document.getElementById('list-count').innerText = `(${count})`;

                const chip = document.createElement('div');
                chip.className = 'player-chip';
                chip.innerText = data.name;
                document.getElementById('player-chips').appendChild(chip);
            }
        } else if (topic.endsWith('/answer')) {
            if (players[data.id] && players[data.id].lastAns === -1) {
                players[data.id].lastAns = data.opt;
                answeredCount++;
                const total = Object.keys(players).length;
                document.getElementById('submit-counter').innerText = `Đã nộp: ${answeredCount} / ${total}`;

                if (data.opt === activeQuestions[currentQ].ans) {
                    const timePerQ = parseInt(document.getElementById('time-picker').value);
                    players[data.id].score += Math.round(500 + (data.time / timePerQ) * 500);
                }
                if (answeredCount >= total && total > 0) {
                    clearInterval(timer);
                    showResult();
                }
            }
        }
    });
}

function toggleFullScreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen().catch(() => {});
}

// --- 4. TIẾN HÀNH THI ĐẤU ---
function startQuiz() {
    document.getElementById('phase2-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    loadQuestion(0);
}

function loadQuestion(idx) {
    currentQ = idx;
    answeredCount = 0;
    const q = activeQuestions[idx];
    const totalTime = parseInt(document.getElementById('time-picker').value);

    document.getElementById('q-counter').innerText = `Câu ${idx + 1}/${activeQuestions.length}`;
    document.getElementById('q-text').innerText = q.text;
    document.getElementById('explain-box').innerText = '';
    document.getElementById('next-btn').classList.add('hidden');
    document.getElementById('submit-counter').innerText = `Đã nộp: 0 / ${Object.keys(players).length}`;

    Object.keys(players).forEach(id => { players[id].lastAns = -1; });

    let optHtml = '';
    q.opts.forEach((opt, i) => {
        optHtml += `<div class="opt-card opt-${i}" id="opt-box-${i}">${['▲','◆','●','■'][i]} ${opt}</div>`;
    });
    document.getElementById('options-container').innerHTML = optHtml;

    client.publish(topicBase + "/question", JSON.stringify({
        qIndex: idx,
        text: q.text,
        opts: q.opts,
        time: totalTime
    }));

    timeLeft = totalTime;
    document.getElementById('time-left').innerText = timeLeft + 's';
    const bar = document.getElementById('progress-bar');
    bar.style.transition = 'none';
    bar.style.width = '100%';
    setTimeout(() => {
        bar.style.transition = `width ${totalTime}s linear`;
        bar.style.width = '0%';
    }, 50);

    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft + 's';
        if (timeLeft <= 0) {
            clearInterval(timer);
            showResult();
        }
    }, 1000);
}

function showResult() {
    const q = activeQuestions[currentQ];
    const box = document.getElementById(`opt-box-${q.ans}`);
    if (box) box.classList.add('correct-mark');
    if (q.explain) document.getElementById('explain-box').innerText = "💡 Lời giải: " + q.explain;

    client.publish(topicBase + "/result", JSON.stringify({ correct: q.ans }));
    document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
    if (currentQ < activeQuestions.length - 1) {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('leaderboard-screen').classList.remove('hidden');
        renderRanking();
    } else {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('leaderboard-screen').classList.remove('hidden');
        document.querySelector('#leaderboard-screen h1').innerText = "🏆 CHUNG CUỘC: VINH DANH QUÁN QUÂN 🏆";
        renderRanking();
        document.getElementById('finish-btn').classList.add('hidden');
    }
}

function renderRanking() {
    const sorted = Object.values(players).sort((a, b) => b.score - a.score).slice(0, 5);
    let rows = '';
    sorted.forEach((p, idx) => {
        rows += `<tr><td>#${idx + 1}</td><td>${p.name}</td><td><strong>${p.score}</strong> pts</td></tr>`;
    });
    document.getElementById('leaderboard-body').innerHTML = rows || '<tr><td colspan="3">Chưa có kết quả</td></tr>';
}

function returnToQuiz() {
    document.getElementById('leaderboard-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    loadQuestion(currentQ + 1);
}
