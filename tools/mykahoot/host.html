<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Đấu Trường ATVSLĐ - Màn Hình Giảng Viên</title>
    <!-- Firebase SDK (Chỉ dùng để lấy đề thi 1 lần) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- MQTT & QRCode (Chịu tải 160+ học viên kết nối thời gian thực) -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; }
        .box { width: 94%; max-width: 1100px; background: #1e293b; border-radius: 20px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative; }
        h1 { color: #f59e0b; margin-bottom: 8px; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        .fs-btn { position: absolute; top: 20px; right: 25px; background: #334155; color: #fff; border: 1px solid #475569; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .fs-btn:hover { background: #475569; }

        /* Sảnh chờ */
        .lobby-layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 30px; margin-top: 15px; align-items: start; }
        .lobby-left { display: flex; flex-direction: column; align-items: center; background: #0f172a; padding: 25px; border-radius: 16px; border: 1px solid #334155; text-align: center; }
        #qrcode { padding: 12px; background: #fff; border-radius: 12px; margin-bottom: 15px; }
        .badge { background: #0284c7; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 16px; display: inline-block; margin-bottom: 12px; }
        .btn-start { width: 100%; background: #10b981; color: #fff; border: none; padding: 15px; border-radius: 10px; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-start:hover { background: #059669; }

        /* Danh sách học viên */
        .lobby-right { background: #0f172a; padding: 20px; border-radius: 16px; border: 1px solid #334155; text-align: left; height: 490px; display: flex; flex-direction: column; }
        .player-list-header { font-size: 18px; font-weight: bold; color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .player-list-scroll { flex: 1; overflow-y: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding-right: 5px; }
        .player-chip { background: #334155; color: #f8fafc; padding: 7px 14px; border-radius: 20px; font-size: 14px; font-weight: 500; border: 1px solid #475569; animation: popIn 0.2s ease-out; }
        @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Màn hình thi */
        .live-status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .timer-bar { width: 100%; height: 14px; background: #334155; border-radius: 7px; overflow: hidden; margin: 15px 0; }
        .timer-progress { width: 100%; height: 100%; background: #ef4444; }
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; text-align: left; }
        .opt-card { padding: 22px; border-radius: 12px; font-size: 19px; font-weight: bold; line-height: 1.4; }
        .opt-0 { background: #dc2626; } .opt-1 { background: #2563eb; } .opt-2 { background: #d97706; } .opt-3 { background: #16a34a; }
        .correct-mark { border: 4px solid #fff; box-shadow: 0 0 20px #fff; transform: scale(1.02); transition: 0.2s; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #f59e0b; }
        .btn-next { background: #10b981; color: #fff; border: none; padding: 14px 28px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- MÀN HÌNH SẢNH CHỜ THI ĐẤU -->
<div class="box" id="lobby-screen">
    <button class="fs-btn" onclick="toggleFullScreen()">⛶ Toàn màn hình</button>
    <h1 id="lobby-title">ĐANG TẢI DỮ LIỆU ĐỀ THI...</h1>
    <div style="text-align: center; margin-bottom: 20px;">
        <span class="badge">Phòng thi: <span id="room-id">...</span></span>
    </div>

    <div class="lobby-layout">
        <div class="lobby-left">
            <div id="qrcode"></div>
            <p style="font-size: 15px; color: #94a3b8; margin-bottom: 12px;">Học viên quét mã QR bằng camera điện thoại</p>
            <div style="font-size: 22px; margin-bottom: 20px;">
                Số học viên đã tham gia: <span id="player-count" style="color:#10b981; font-weight:bold; font-size:26px;">0</span>
            </div>
            <button class="btn-start" onclick="startQuiz()">BẮT ĐẦU CUỘC THI</button>
        </div>

        <div class="lobby-right">
            <div class="player-list-header">
                <span>Danh sách học viên tham gia</span>
                <span id="list-count" style="color:#f59e0b;">(0)</span>
            </div>
            <div class="player-list-scroll" id="player-chips-container"></div>
        </div>
    </div>
</div>

<!-- MÀN HÌNH CÂU HỎI -->
<div class="box hidden" id="quiz-screen">
    <button class="fs-btn" onclick="toggleFullScreen()">⛶ Toàn màn hình</button>
    <div class="live-status">
        <span class="badge" id="q-counter">Câu 1/4</span>
        <span class="badge" style="background:#0d9488;" id="submit-counter">Đã nộp: 0 / 0</span>
        <span class="badge" style="background:#ef4444;" id="time-left">30s</span>
    </div>
    <h2 id="q-text" style="font-size: 22px; margin: 15px 0; min-height: 55px; line-height: 1.4; text-align: left;"></h2>
    <div class="timer-bar"><div class="timer-progress" id="progress-bar"></div></div>
    <div class="grid-options" id="options-container"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
        <div id="explain-box" style="text-align: left; color: #cbd5e1; font-style: italic; max-width: 75%;"></div>
        <button class="btn-next hidden" id="next-btn" onclick="nextQuestion()">CÂU TIẾP THEO</button>
    </div>
</div>

<!-- MÀN HÌNH BẢNG XẾP HẠNG LEADERBOARD -->
<div class="box hidden" id="leaderboard-screen">
    <button class="fs-btn" onclick="toggleFullScreen()">⛶ Toàn màn hình</button>
    <h1>🏆 BẢNG XẾP HẠNG TOP THI ĐẤU 🏆</h1>
    <table>
        <thead><tr><th>Hạng</th><th>Tên học viên</th><th>Điểm số</th></tr></thead>
        <tbody id="leaderboard-body"></tbody>
    </table>
    <div style="margin-top: 25px; text-align: center;">
        <button class="btn-next" id="finish-btn" onclick="returnToQuiz()">TIẾP TỤC</button>
    </div>
</div>

<script>
// --- CẤU HÌNH THÔNG SỐ FIREBASE CỦA BẠN TẠI ĐÂY ---
const firebaseConfig = {
    apiKey: "AIzaSyYOUR_API_KEY",
    authDomain: "hse-arena.firebaseapp.com",
    projectId: "hse-arena",
    storageBucket: "hse-arena.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// --- ÂM THANH THỜI GIAN THỰC (WEB AUDIO API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let tickInterval = null;
function playTone(freq, duration, type='sine', gain=0.1) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(gain, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function playTickSound() { playTone(800, 0.05, 'triangle', 0.04); }
function startCountdownAudio() { clearInterval(tickInterval); tickInterval = setInterval(playTickSound, 1000); }
function stopCountdownAudio() { clearInterval(tickInterval); }
function playResultFanfare() {
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => playTone(f, 0.4, 'triangle', 0.15), i * 120));
}

// --- ĐỌC THAM SỐ URL & TẢI ĐỀ THI 1 LẦN TỪ FIRESTORE ---
const urlParams = new URLSearchParams(window.location.search);
const ROOM = urlParams.get('room') || ("FPT_" + Math.floor(1000 + Math.random() * 9000));
const quizId = urlParams.get('quiz');
document.getElementById('room-id').innerText = ROOM;

let activeQuestions = [];
let timePerQuestion = 30;

auth.onAuthStateChanged(user => {
    if (user && quizId) {
        // Chỉ đọc đúng 1 bản ghi của đề thi này từ Firestore rồi dừng
        db.collection("users").doc(user.uid).collection("quizzes").doc(quizId).get().then(doc => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('lobby-title').innerText = data.title;
                activeQuestions = data.questions;
                timePerQuestion = data.timePerQuestion || 30;
                initMQTTAndQR();
            } else {
                alert("Không tìm thấy dữ liệu đề thi trên hệ thống!");
            }
        });
    } else {
        // Dự phòng khi mở trực tiếp không qua dashboard
        document.getElementById('lobby-title').innerText = "HUẤN LUYỆN ATVSLĐ - FPT TELECOM";
        initMQTTAndQR();
    }
});

function initMQTTAndQR() {
    // Tạo mã QR dẫn học viên vào phòng qua MQTT
    const studentURL = window.location.href.split('host.html')[0] + "play.html?room=" + ROOM;
    const qrContainer = document.getElementById("qrcode");
    qrContainer.innerHTML = '';
    new QRCode(qrContainer, { text: studentURL, width: 260, height: 260 });

    startMQTT();
}

// --- TOÀN BỘ KẾT NỐI HỌC VIÊN QUA MQTT BROKER (KHÔNG CHẠM FIREBASE) ---
let currentQ = 0;
let players = {};
let timer = null;
let timeLeft = 0;
let answeredCount = 0;
let client = null;
const topicBase = "fpt_hse_quiz/" + ROOM;

function startMQTT() {
    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    client.on('connect', () => {
        client.subscribe(topicBase + "/join");
        client.subscribe(topicBase + "/answer");
    });

    client.on('message', (topic, message) => {
        const data = JSON.parse(message.toString());
        if (topic.endsWith('/join')) {
            if (!players[data.id]) {
                players[data.id] = { name: data.name, score: 0, lastAns: -1 };
                addPlayerToUI(data.name);
            }
        } else if (topic.endsWith('/answer')) {
            if (players[data.id] && players[data.id].lastAns === -1) {
                players[data.id].lastAns = data.opt;
                answeredCount++;
                updateSubmitCounter();
                if (data.opt === activeQuestions[currentQ].ans) {
                    const score = Math.round(500 + (data.time / timePerQuestion) * 500);
                    players[data.id].score += score;
                }
                if (answeredCount >= Object.keys(players).length && Object.keys(players).length > 0) {
                    clearInterval(timer);
                    stopCountdownAudio();
                    showAnswerResult();
                }
            }
        }
    });
}

function addPlayerToUI(name) {
    const count = Object.keys(players).length;
    document.getElementById('player-count').innerText = count;
    document.getElementById('list-count').innerText = `(${count})`;

    const chipsContainer = document.getElementById('player-chips-container');
    const chip = document.createElement('div');
    chip.className = 'player-chip';
    chip.innerText = name;
    chipsContainer.appendChild(chip);
}

function updateSubmitCounter() {
    const total = Object.keys(players).length;
    document.getElementById('submit-counter').innerText = `Đã nộp: ${answeredCount} / ${total}`;
}

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
}

function startQuiz() {
    document.getElementById('lobby-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    loadQuestion(0);
}

function loadQuestion(idx) {
    currentQ = idx;
    answeredCount = 0;
    const q = activeQuestions[idx];
    
    document.getElementById('q-counter').innerText = `Câu ${idx + 1}/${activeQuestions.length}`;
    document.getElementById('q-text').innerText = q.text;
    document.getElementById('explain-box').innerText = '';
    document.getElementById('next-btn').classList.add('hidden');
    updateSubmitCounter();
    
    Object.keys(players).forEach(id => { players[id].lastAns = -1; });

    let optHtml = '';
    q.opts.forEach((opt, i) => {
        optHtml += `<div class="opt-card opt-${i}" id="opt-box-${i}">${['▲','◆','●','■'][i]} ${opt}</div>`;
    });
    document.getElementById('options-container').innerHTML = optHtml;

    client.publish(topicBase + "/question", JSON.stringify({
        qIndex: idx,
        text: q.text,
        opts: q.opts,
        time: timePerQuestion
    }));

    timeLeft = timePerQuestion;
    document.getElementById('time-left').innerText = timeLeft + 's';
    const bar = document.getElementById('progress-bar');
    bar.style.transition = 'none';
    bar.style.width = '100%';
    setTimeout(() => {
        bar.style.transition = `width ${timePerQuestion}s linear`;
        bar.style.width = '0%';
    }, 50);

    startCountdownAudio();
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft + 's';
        if (timeLeft <= 0) {
            clearInterval(timer);
            stopCountdownAudio();
            showAnswerResult();
        }
    }, 1000);
}

function showAnswerResult() {
    stopCountdownAudio();
    playResultFanfare();
    const q = activeQuestions[currentQ];
    
    const box = document.getElementById(`opt-box-${q.ans}`);
    if (box) box.classList.add('correct-mark');
    if (q.explain) {
        document.getElementById('explain-box').innerText = "💡 Lời giải: " + q.explain;
    }

    client.publish(topicBase + "/result", JSON.stringify({ correct: q.ans }));
    document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
    if (currentQ < activeQuestions.length - 1) {
        showLeaderboard();
    } else {
        showFinalLeaderboard();
    }
}

function showLeaderboard() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('leaderboard-screen').classList.remove('hidden');
    renderRanking();
}

function renderRanking() {
    const sorted = Object.values(players).sort((a, b) => b.score - a.score).slice(0, 5);
    let rows = '';
    sorted.forEach((p, idx) => {
        rows += `<tr><td>#${idx + 1}</td><td>${p.name}</td><td><strong>${p.score}</strong> pts</td></tr>`;
    });
    document.getElementById('leaderboard-body').innerHTML = rows || '<tr><td colspan="3">Chưa có kết quả</td></tr>';
}

function returnToQuiz() {
    document.getElementById('leaderboard-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    loadQuestion(currentQ + 1);
}

function showFinalLeaderboard() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('leaderboard-screen').classList.remove('hidden');
    document.querySelector('#leaderboard-screen h1').innerText = "🏆 CHUNG CUỘC: VINH DANH QUÁN QUÂN 🏆";
    renderRanking();
    document.getElementById('finish-btn').classList.add('hidden');
}
</script>
</body>
</html>
