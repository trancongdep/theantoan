<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Trị Đấu Trường - Dành Cho Giảng Viên</title>
    <!-- Firebase SDK v9 (Compat version để dễ nhúng CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 800px; background: #1e293b; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn-google { background: #ea4335; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; margin: 20px auto; }
        .header-user { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info img { width: 42px; height: 42px; border-radius: 50%; }
        .btn-logout { background: transparent; color: #94a3b8; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .quiz-item { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .btn-launch { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <!-- KHUNG ĐĂNG NHẬP -->
    <div id="login-section" style="text-align: center;">
        <h1 style="color:#f59e0b; margin-bottom: 10px;">HỆ THỐNG ĐẤU TRƯỜNG ATVSLĐ</h1>
        <p style="color:#94a3b8;">Dành cho Giảng viên & Chuyên viên An toàn Lao động</p>
        <button class="btn-google" onclick="loginWithGoogle()">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1H12v2.98h5.36c-.23 1.25-.94 2.31-2 3.01v2.5h3.24c1.89-1.74 2.98-4.3 2.98-7.39 0-.67-.06-1.32-.23-2.1z"/><path fill="currentColor" d="M12 21c2.7 0 4.96-.89 6.62-2.42l-3.24-2.5c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.75-5.59-4.11H3.06v2.58C4.74 18.84 8.1 21 12 21z"/><path fill="currentColor" d="M6.41 12.93c-.2-.6-.32-1.25-.32-1.93s.12-1.33.32-1.93V6.49H3.06C2.39 7.82 2 9.36 2 11s.39 3.18 1.06 4.51l3.35-2.58z"/><path fill="currentColor" d="M12 5.38c1.47 0 2.79.5 3.82 1.49l2.87-2.87C16.95 2.35 14.7 1.38 12 1.38 8.1 1.38 4.74 3.54 3.06 6.49l3.35 2.58c.79-2.36 2.99-4.11 5.59-4.11z"/></svg>
            Đăng nhập bằng Google
        </button>
    </div>

    <!-- KHUNG QUẢN LÝ ĐỀ THI (SAU KHI ĐĂNG NHẬP) -->
    <div id="dashboard-section" class="hidden">
        <div class="header-user">
            <div class="user-info">
                <img id="user-avatar" src="" alt="">
                <div>
                    <strong id="user-name"></strong>
                    <div style="font-size:12px; color:#94a3b8;" id="user-email"></div>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">Đăng xuất</button>
        </div>

        <h3 style="color:#38bdf8; margin-bottom: 15px;">Danh sách đề thi của bạn</h3>
        <div id="quiz-list">
            <!-- Đề thi của từng giảng viên sẽ tải động tại đây -->
        </div>
    </div>
</div>

<script>
// CẤU HÌNH THÔNG SỐ FIREBASE CỦA BẠN TẠI ĐÂY
const firebaseConfig = {
    apiKey: "AIzaSyYOUR_API_KEY",
    authDomain: "hse-arena.firebaseapp.com",
    projectId: "hse-arena",
    storageBucket: "hse-arena.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Kiểm tra trạng thái đăng nhập
auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('user-name').innerText = user.displayName;
        document.getElementById('user-email').innerText = user.email;
        document.getElementById('user-avatar').src = user.photoURL;
        loadTeacherQuizzes(user.uid);
    } else {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
    }
});

function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => alert("Lỗi đăng nhập: " + err.message));
}

function logout() {
    auth.signOut();
}

// Tải danh sách đề thi riêng của GV đăng nhập
function loadTeacherQuizzes(uid) {
    const listEl = document.getElementById('quiz-list');
    listEl.innerHTML = '<p style="color:#94a3b8;">Đang tải bộ đề...</p>';

    db.collection("users").doc(uid).collection("quizzes").get().then(snapshot => {
        listEl.innerHTML = '';
        if (snapshot.empty) {
            // Tự động khởi tạo 4 đề mẫu FPT nếu là tài khoản mới
            initDefaultQuizzes(uid);
            return;
        }
        snapshot.forEach(doc => {
            const q = doc.data();
            const item = document.createElement('div');
            item.className = 'quiz-item';
            item.innerHTML = `
                <div>
                    <strong>${q.title}</strong>
                    <div style="color:#94a3b8; font-size:13px;">${q.questions.length} câu hỏi • ${q.timePerQuestion}s/câu</div>
                </div>
                <button class="btn-launch" onclick="launchRoom('${doc.id}')">MỞ LỚP NÀY ➔</button>
            `;
            listEl.appendChild(item);
        });
    });
}

// Khởi tạo sẵn 4 đề gốc vào tài khoản giảng viên mới
function initDefaultQuizzes(uid) {
    const defaultBatch = [
        { title: "Phần 1: Pháp luật ATVSLĐ & An toàn điện", timePerQuestion: 30, questionsCount: 4 },
        { title: "Phần 2: Nghiệp vụ công tác ATVSLĐ", timePerQuestion: 35, questionsCount: 3 },
        { title: "Phần 3: Nhận diện yếu tố nguy hiểm, có hại", timePerQuestion: 30, questionsCount: 4 },
        { title: "Phần 4: Kiểm soát rủi ro & Văn hóa Bradley", timePerQuestion: 30, questionsCount: 3 }
    ];
    const batch = db.batch();
    defaultBatch.forEach(d => {
        const docRef = db.collection("users").doc(uid).collection("quizzes").doc();
        batch.set(docRef, { ...d, questions: [] });
    });
    batch.commit().then(() => loadTeacherQuizzes(uid));
}

function launchRoom(quizId) {
    // Tạo Room ID ngẫu nhiên có tiền tố theo UID giảng viên để chống trùng lặp
    const roomId = "R_" + Math.random().toString(36).substring(2, 7).toUpperCase();
    window.location.href = `host.html?room=${roomId}&quiz=${quizId}`;
}
</script>
</body>
</html>
