<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh mục Tuyến & Trụ — LĐCT-OPMS v1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/gas-api.js"></script>
  <script src="js/auth-guard.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="nav-mount"></div>
  <main class="lg:ml-64 p-5 max-w-6xl">
    <div class="flex items-center justify-between mb-4">
      <div><h1 class="text-xl font-bold text-slate-900">Danh mục Tài sản Lưới điện 110–220kV</h1><p class="text-xs text-slate-500">Quản lý tuyến ĐDK, cáp ngầm, tọa độ GPS trụ/hầm nối cáp theo 4086/QĐ-EVNHCMC</p></div>
      <button onclick="openAssetModal()" class="px-3.5 py-2 bg-blue-900 text-white rounded-lg text-xs font-semibold"><i class="fa-solid fa-plus mr-1"></i>Thêm Trụ / Hầm cáp</button>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="p-3">Mã Tài sản</th><th class="p-3">Tuyến</th><th class="p-3">Cấp ĐA</th><th class="p-3">Loại</th><th class="p-3">Vị trí (Trụ/Hầm)</th><th class="p-3">Tọa độ GPS</th></tr></thead>
        <tbody id="asset-body" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </main>
  <div id="asset-modal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-5 space-y-3">
      <h2 class="text-base font-bold text-slate-900">Thêm Vị trí Lưới điện</h2>
      <input id="a-line" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Mã tuyến (VD: 171-TD)" />
      <input id="a-name" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Tên tuyến (VD: 110kV Thủ Đức - Cát Lái)" />
      <div class="grid grid-cols-2 gap-2">
        <select id="a-volt" class="border rounded-lg px-3 py-2 text-sm"><option value="110kV">110kV</option><option value="220kV">220kV</option></select>
        <select id="a-type" class="border rounded-lg px-3 py-2 text-sm"><option value="DDK">Đường dây trên không</option><option value="CAP_NGAM">Cáp ngầm</option></select>
      </div>
      <input id="a-pos" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Vị trí (VD: Trụ 18 hoặc Hầm J04)" />
      <div class="grid grid-cols-2 gap-2">
        <input id="a-lat" class="border rounded-lg px-3 py-2 text-sm" placeholder="Lat (10.8...)" />
        <input id="a-lng" class="border rounded-lg px-3 py-2 text-sm" placeholder="Lng (106.7...)" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeAssetModal()" class="px-3 py-2 text-xs border rounded-lg">Hủy</button>
        <button onclick="saveAsset()" class="px-4 py-2 text-xs bg-blue-900 text-white rounded-lg font-semibold">Lưu tài sản</button>
      </div>
    </div>
  </div>
  <script>
    requireAuth(() => {
      db.ref("assets").on("value", (snap) => {
        const list = Object.values(snap.val() || {});
        const tbody = document.getElementById("asset-body");
        if (list.length === 0) { tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400 text-xs">Chưa có danh mục tuyến/trụ.</td></tr>`; return; }
        tbody.innerHTML = list.map(a => `<tr><td class="p-3 font-mono text-xs font-semibold">${a.assetId}</td><td class="p-3 text-xs">${a.maTuyen} — ${a.tenTuyen}</td><td class="p-3 text-xs">${a.capDienAp}</td><td class="p-3 text-xs">${a.loaiTaiSan}</td><td class="p-3 text-xs">${a.viTri}</td><td class="p-3 font-mono text-xs">${a.lat || ""}, ${a.lng || ""}</td></tr>`).join("");
      });
    });
    function openAssetModal() { if (!canApprove()) return alert("Chỉ Đội trưởng/Tổ trưởng mới được cập nhật danh mục."); document.getElementById("asset-modal").classList.remove("hidden"); }
    function closeAssetModal() { document.getElementById("asset-modal").classList.add("hidden"); }
    async function saveAsset() {
      const maTuyen = document.getElementById("a-line").value.trim(), viTri = document.getElementById("a-pos").value.trim();
      if (!maTuyen || !viTri) return alert("Vui lòng nhập Mã tuyến và Vị trí.");
      const assetId = `${maTuyen}_${viTri}`.replace(/[^a-zA-Z0-9_-]/g, "_");
      const payload = { assetId, maTuyen, tenTuyen: document.getElementById("a-name").value.trim(), capDienAp: document.getElementById("a-volt").value, loaiTaiSan: document.getElementById("a-type").value, viTri, lat: document.getElementById("a-lat").value.trim(), lng: document.getElementById("a-lng").value.trim(), doiQLVH: "Đội QLLĐ 2" };
      await db.ref("assets/" + assetId).set(payload); await callGasApi("syncAsset", payload); closeAssetModal();
    }
  </script>
</body>
</html>
