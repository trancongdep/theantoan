<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiểm tra Kỹ thuật &amp; CBM — LĐCT-OPMS v1.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/gas-api.js"></script>
  <script src="js/offline-sync.js"></script>
  <script src="js/auth-guard.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="nav-mount"></div>
  <main class="lg:ml-64 p-4 sm:p-6 max-w-3xl">
    <h1 class="text-xl font-bold text-slate-900 mb-1">Kiểm tra Kỹ thuật &amp; Chẩn đoán CBM (Tier 1–3)</h1>
    <p class="text-xs text-slate-500 mb-4">Trèo thân trụ (12 tháng), cắt điện cáp ngầm (36 tháng), tự động tính ΔT, CHI và kích hoạt Tier 3 khi CHI &lt; 4.0</p>
    <div class="bg-white p-5 rounded-xl border border-slate-200 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <input id="c-line" list="dl-lines" oninput="updatePosDatalist()" class="border rounded-lg px-3 py-2 text-sm" placeholder="Mã tuyến (VD: CB-TQ)" />
        <input id="c-asset" list="dl-positions" class="border rounded-lg px-3 py-2 text-sm" placeholder="Vị trí (VD: Trụ 18 / Hầm J04)" />
      </div>
      <datalist id="dl-lines"></datalist>
      <datalist id="dl-positions"></datalist>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <div><label class="block text-xs font-medium text-slate-700 mb-1">Nhiệt độ mối nối (°C)</label><input id="c-t1" type="number" step="0.1" oninput="calcCBM()" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="55.0" /></div>
        <div><label class="block text-xs font-medium text-slate-700 mb-1">Nhiệt độ đối chứng (°C)</label><input id="c-t0" type="number" step="0.1" oninput="calcCBM()" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="32.0" /></div>
        <div><label class="block text-xs font-medium text-slate-700 mb-1">Độ chênh ΔT (°C)</label><input id="c-dt" readonly class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100 font-mono font-bold" /></div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div><label class="block text-xs font-medium text-slate-700 mb-1">PD Online (pC)</label><input id="c-pd" type="number" oninput="calcCBM()" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="VD: 280" /></div>
        <div><label class="block text-xs font-medium text-slate-700 mb-1">Thử vỏ bọc HVDC (kV)</label><input id="c-hvdc" type="number" step="0.1" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="VD: 10 (5 phút)" /></div>
        <div><label class="block text-xs font-medium text-slate-700 mb-1">Hệ số hấp thụ DAR</label><input id="c-dar" type="number" step="0.01" oninput="calcCBM()" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Tốt ≥ 1.1" /></div>
      </div>
      <div id="cbm-alert" class="p-3.5 rounded-xl bg-slate-100 text-xs text-slate-700">Nhập thông số đo để tự động đánh giá mức ΔT, PD và Chỉ số sức khỏe (CHI).</div>
      <div><label class="block text-xs font-medium text-slate-700 mb-1">Điểm CHI đánh giá (0.0 – 10.0)</label><input id="c-chi" type="number" step="0.1" min="0" max="10" oninput="calcCBM()" class="w-full border rounded-lg px-3 py-2 text-sm font-mono font-bold" value="8.0" /></div>
      <div><label class="block text-xs font-medium text-slate-700 mb-1">Ảnh nhiệt Fluke TiS50 / Ảnh kiểm tra kỹ thuật</label><input id="c-photos" type="file" accept="image/*" multiple class="w-full text-xs border rounded-lg p-2" /></div>
      <button onclick="submitCBM()" id="btn-cbm" class="w-full py-3 bg-teal-700 hover:bg-teal-800 text-white rounded-xl text-sm font-semibold">Lưu Kết quả Kỹ thuật &amp; CBM</button>
    </div>
  </main>
  <script>
    let assetList = [];
    requireAuth(() => {
      db.ref("assets").once("value", (snap) => {
        assetList = Object.values(snap.val() || {});
        const lines = Array.from(new Set(assetList.map(a => a.maTuyen).filter(Boolean))).sort();
        document.getElementById("dl-lines").innerHTML = lines.map(l => `<option value="${escapeHtml(l)}">`).join("");
        updatePosDatalist();
      });
    });
    function updatePosDatalist() {
      const line = document.getElementById("c-line").value.trim();
      const pos = assetList.filter(a => !line || a.maTuyen === line).map(a => a.viTri).filter(Boolean);
      document.getElementById("dl-positions").innerHTML = Array.from(new Set(pos)).slice(0, 200).map(v => `<option value="${escapeHtml(v)}">`).join("");
    }
    function calcCBM() {
      const t1 = parseFloat(document.getElementById("c-t1").value), t0 = parseFloat(document.getElementById("c-t0").value);
      const pd = parseFloat(document.getElementById("c-pd").value || 0), chi = parseFloat(document.getElementById("c-chi").value || 8);
      let dt = ""; if (!isNaN(t1) && !isNaN(t0)) { dt = (t1 - t0).toFixed(1); document.getElementById("c-dt").value = dt; }
      const msgs = []; let severe = false;
      if (dt !== "" && Number(dt) > 30) { msgs.push(`ΔT = ${dt}°C (>30°C): Nguy hiểm — xử lý khẩn cấp.`); severe = true; }
      else if (dt !== "" && Number(dt) > 20) { msgs.push(`ΔT = ${dt}°C (20–30°C): Mức Trung bình — lập kế hoạch sửa chữa trong 3 tháng.`); }
      if (pd >= 250 && pd <= 350) { msgs.push(`PD = ${pd} pC (250–350 pC): Mức Trung bình — đo lặp lại sau 03 tháng.`); }
      else if (pd > 350) { msgs.push(`PD = ${pd} pC (>350 pC): Cảnh báo cao — cần kích hoạt CBM Tier 3.`); severe = true; }
      if (chi < 4.0) { msgs.push(`CHI = ${chi} (< 4.0 Mức Xấu): Bắt buộc kích hoạt CBM Tier 3 và xử lý ≤ 30 ngày.`); severe = true; }
      const box = document.getElementById("cbm-alert");
      if (msgs.length === 0) { box.className = "p-3.5 rounded-xl bg-emerald-50 text-xs text-emerald-900 border border-emerald-200"; box.textContent = "Các thông số trong giới hạn vận hành bình thường."; }
      else { box.className = severe ? "p-3.5 rounded-xl bg-red-50 text-xs text-red-900 border border-red-200 font-medium" : "p-3.5 rounded-xl bg-amber-50 text-xs text-amber-900 border border-amber-200 font-medium"; box.innerHTML = msgs.join("<br>"); }
    }
    async function submitCBM() {
      if (isReadOnly()) return alert("Tài khoản VIEWER không có quyền ghi.");
      const btn = document.getElementById("btn-cbm"); btn.disabled = true; btn.textContent = "Đang lưu kết quả CBM...";
      try {
        const cbmId = "CBM-" + Date.now().toString().slice(-7);
        const files = Array.from(document.getElementById("c-photos").files || []);
        const photos = []; for (const f of files) photos.push(await compressImageWithWatermark(f, "CBM-IR"));
        const chiScore = parseFloat(document.getElementById("c-chi").value || 8), deltaT = document.getElementById("c-dt").value;
        const payload = { cbmId, maTuyen: document.getElementById("c-line").value.trim(), assetId: document.getElementById("c-asset").value.trim(), nguoiDo: window.currentUserProfile.name, thoiGianDo: new Date().toISOString(), nhietDoMoiNoi: document.getElementById("c-t1").value, nhietDoMoiTruong: document.getElementById("c-t0").value, deltaT, pd: document.getElementById("c-pd").value, hvdc: document.getElementById("c-hvdc").value, dar: document.getElementById("c-dar").value, chiScore, mucDanhGia: chiScore < 4.0 ? "XAU" : (chiScore < 7.0 ? "TRUNG_BINH" : "TOT"), kichHoatTier3: chiScore < 4.0, photos };
        const fbData = { ...payload, photos: null };
        if (!navigator.onLine) {
          await enqueueOfflinePayload({ queueId: cbmId, firebasePath: "cbm_logs/" + cbmId, firebaseData: fbData, gasAction: "saveCBM", gasData: payload });
          alert("Mất mạng! Đã lưu hồ sơ CBM " + cbmId + " vào hàng đợi Offline.");
        } else {
          await db.ref("cbm_logs/" + cbmId).set(fbData);
          if (chiScore < 4.0 || Number(deltaT) > 20) await db.ref("defects/DEF-" + cbmId).set({ defectId: "DEF-" + cbmId, recordId: cbmId, maTuyen: payload.maTuyen, assetId: payload.assetId, moTa: `CBM Cảnh báo: CHI=${chiScore}, ΔT=${deltaT}°C`, trangThai: "OPEN", nguoiMo: payload.nguoiDo, ngayMo: payload.thoiGianDo });
          await callGasApi("saveCBM", payload);
          alert("Đã lưu hồ sơ CBM " + cbmId);
        }
        location.href = "dashboard.html";
      } catch (err) { alert("Lỗi: " + err.message); } finally { btn.disabled = false; btn.textContent = "Lưu Kết quả Kỹ thuật & CBM"; }
    }
  </script>
</body>
</html>
