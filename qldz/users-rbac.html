<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phân quyền RBAC — LĐCT-OPMS v1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-guard.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="nav-mount"></div>
  <main class="lg:ml-64 p-5 max-w-5xl">
    <h1 class="text-xl font-bold text-slate-900 mb-1">Phân quyền Đa cấp (RBAC)</h1>
    <p class="text-xs text-slate-500 mb-4">Chỉ Đội trưởng (CAPTAIN) mới có quyền thay đổi vai trò trên Firebase Rules</p>
    <div class="bg-white p-4 rounded-xl border border-slate-200 mb-5 grid grid-cols-1 md:grid-cols-5 gap-2">
      <input id="u-uid" class="border rounded-lg px-3 py-2 text-xs font-mono" placeholder="Firebase UID" />
      <input id="u-name" class="border rounded-lg px-3 py-2 text-xs" placeholder="Họ và tên" />
      <input id="u-email" class="border rounded-lg px-3 py-2 text-xs" placeholder="Email" />
      <select id="u-role" class="border rounded-lg px-3 py-2 text-xs">
        <option value="INSPECTOR">INSPECTOR (Nhân viên QLVH)</option>
        <option value="TEAM_LEAD">TEAM_LEAD (Tổ trưởng)</option>
        <option value="CAPTAIN">CAPTAIN (Đội trưởng/Phó)</option>
        <option value="VIEWER">VIEWER (KTVH / An toàn)</option>
      </select>
      <button onclick="saveUser()" class="bg-blue-900 text-white rounded-lg px-3 py-2 text-xs font-semibold">Lưu quyền</button>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="p-3">UID</th><th class="p-3">Họ tên</th><th class="p-3">Email</th><th class="p-3">Vai trò</th></tr></thead>
        <tbody id="user-body" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </main>
  <script>
    requireAuth(() => {
      db.ref("users").on("value", (snap) => {
        document.getElementById("user-body").innerHTML = Object.entries(snap.val() || {}).map(([uid, u]) => `<tr><td class="p-3 font-mono text-xs">${uid}</td><td class="p-3 text-xs font-medium">${u.name || ""}</td><td class="p-3 text-xs">${u.email || ""}</td><td class="p-3 text-xs font-semibold text-blue-900">${u.role}</td></tr>`).join("");
      });
    });
    async function saveUser() {
      if (window.currentUserProfile?.role !== "CAPTAIN") return alert("Chỉ tài khoản CAPTAIN mới được phân quyền.");
      const uid = document.getElementById("u-uid").value.trim(); if (!uid) return alert("Nhập Firebase UID.");
      await db.ref("users/" + uid).set({ name: document.getElementById("u-name").value.trim(), email: document.getElementById("u-email").value.trim(), role: document.getElementById("u-role").value, team: "Đội QLLĐ 2", active: true });
      alert("Đã cập nhật phân quyền.");
    }
  </script>
</body>
</html>
