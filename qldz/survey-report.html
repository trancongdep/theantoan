<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khảo sát & Báo cáo Công tác — LĐCT-OPMS v1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/gas-api.js"></script>
  <script src="js/offline-sync.js"></script>
  <script src="js/auth-guard.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="nav-mount"></div>
  <main class="lg:ml-64 p-4 sm:p-6 max-w-3xl">
    <h1 class="text-xl font-bold text-slate-900 mb-1">Khảo sát Hiện trường &amp; Báo cáo Công tác được giao</h1>
    <p class="text-xs text-slate-500 mb-4">Lập BBKS hiện trường (Điều 16 QT 278/QĐ-EVN) hoặc báo cáo kết quả thực hiện nhiệm vụ, xuất PDF lưu Drive</p>
    <div class="bg-white p-5 rounded-xl border border-slate-200 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <input id="s-task" class="border rounded-lg px-3 py-2 text-sm font-mono" placeholder="Mã công tác / Lệnh giao (TSK-...)" />
        <input id="s-line" class="border rounded-lg px-3 py-2 text-sm" placeholder="Tuyến đường dây / TBA" />
      </div>
      <input id="s-asset" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Vị trí khảo sát (VD: Khoảng cột 24A–27A)" />
      <div class="space-y-2">
        <div class="text-xs font-semibold text-slate-800">Ranh giới an toàn &amp; Biện pháp kỹ thuật bắt buộc</div>
        <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="s-cut" /> Đã xác định ranh giới cắt điện &amp; vị trí đặt tiếp địa di động</label>
        <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="s-cross" /> Đã kiểm tra điểm giao chéo, cảm ứng tĩnh điện (25m với 220kV)</label>
        <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="s-equip" /> Đã xác nhận đường vận chuyển, vị trí đặt xe cẩu / thiết bị nâng</label>
      </div>
      <div><label class="block text-xs font-medium text-slate-700 mb-1">Nội dung khảo sát / Kết quả công tác được giao</label><textarea id="s-content" rows="4" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Mô tả chi tiết hiện trạng mặt bằng, biện pháp an toàn đề xuất hoặc kết quả hoàn thành..."></textarea></div>
      <div><label class="block text-xs font-medium text-slate-700 mb-1">Ảnh khảo sát hiện trường</label><input id="s-photos" type="file" accept="image/*" multiple class="w-full text-xs border rounded-lg p-2" /></div>
      <button onclick="submitSurvey()" id="btn-survey" class="w-full py-3 bg-blue-900 hover:bg-blue-950 text-white rounded-xl text-sm font-semibold">Nộp Báo cáo &amp; Xuất Biên bản PDF</button>
    </div>
  </main>
  <script>
    requireAuth(() => {});
    async function submitSurvey() {
      if (isReadOnly()) return alert("Tài khoản VIEWER không có quyền ghi.");
      const btn = document.getElementById("btn-survey"); btn.disabled = true; btn.textContent = "Đang xuất PDF & lưu Drive...";
      try {
        const surveyId = "SRV-" + Date.now().toString().slice(-7);
        const files = Array.from(document.getElementById("s-photos").files || []);
        const photos = []; for (const f of files) photos.push(await compressImageWithWatermark(f, "KHẢO SÁT"));
        const payload = { surveyId, taskId: document.getElementById("s-task").value.trim(), maTuyen: document.getElementById("s-line").value.trim(), assetId: document.getElementById("s-asset").value.trim(), nguoiLap: window.currentUserProfile.name, thoiGian: new Date().toISOString(), ranhGioiAnToan: { catDienTiepDia: document.getElementById("s-cut").checked, giaoCheoCamUng: document.getElementById("s-cross").checked, xeCauMatBang: document.getElementById("s-equip").checked }, noiDungBaoCao: document.getElementById("s-content").value.trim(), photos, trangThaiDuyet: "SUBMITTED" };
        await db.ref("inspections/" + surveyId).set({ recordId: surveyId, taskId: payload.taskId, maTuyen: payload.maTuyen, assetId: payload.assetId, loaiKT: "KHAO_SAT_HIEN_TRUONG", nguoiKT: payload.nguoiLap, thoiGianKT: payload.thoiGian, ketQua: "HOAN_THANH", ghiChu: payload.noiDungBaoCao, trangThaiDuyet: "SUBMITTED" });
        const res = await callGasApi("saveSurvey", payload);
        alert("Đã nộp báo cáo " + surveyId + (res.pdfUrl ? ("\nBiên bản PDF: " + res.pdfUrl) : "")); location.href = "dashboard.html";
      } catch (err) { alert("Lỗi: " + err.message); } finally { btn.disabled = false; btn.textContent = "Nộp Báo cáo & Xuất Biên bản PDF"; }
    }
  </script>
</body>
</html>
