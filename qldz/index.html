<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — LĐCT-OPMS v1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-sm p-7">
    <div class="flex items-center gap-3 mb-5">
      <div class="w-11 h-11 rounded-xl bg-blue-900 text-white flex items-center justify-center text-lg">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-900">LĐCT-OPMS v1.0</h1>
        <p class="text-xs text-slate-500">Quản lý Vận hành Lưới điện 110–220kV (4086/QĐ-EVNHCMC)</p>
      </div>
    </div>
    <button onclick="loginGoogle()" class="w-full py-2.5 px-4 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-800 font-medium text-sm flex items-center justify-center gap-2 mb-5">
      <i class="fa-brands fa-google text-blue-700"></i>
      <span>Đăng nhập bằng Google (Cán bộ EVNHCMC)</span>
    </button>
    <div class="relative flex py-2 items-center mb-5">
      <div class="flex-grow border-t border-slate-200"></div>
      <span class="flex-shrink mx-3 text-xs text-slate-400">Hoặc tài khoản Tổ QLVH</span>
      <div class="flex-grow border-t border-slate-200"></div>
    </div>
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Email</label>
        <input id="email" type="email" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="toqlvh@evnhcmc.vn" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Mật khẩu</label>
        <input id="password" type="password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="••••••••" />
      </div>
      <button onclick="loginEmail()" class="w-full py-2.5 bg-blue-900 hover:bg-blue-950 text-white rounded-xl text-sm font-semibold">Đăng nhập</button>
    </div>
    <p id="err-msg" class="text-xs text-red-600 mt-3 hidden"></p>
  </div>
  <script>
    auth.onAuthStateChanged((user) => { if (user) location.href = "dashboard.html"; });
    async function loginGoogle() {
      try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
      catch (err) { showErr(err.message); }
    }
    async function loginEmail() {
      try { await auth.signInWithEmailAndPassword(document.getElementById("email").value.trim(), document.getElementById("password").value); }
      catch (err) { showErr("Sai email hoặc mật khẩu: " + err.message); }
    }
    function showErr(msg) {
      const el = document.getElementById("err-msg");
      el.textContent = msg; el.classList.remove("hidden");
    }
  </script>
</body>
</html>
