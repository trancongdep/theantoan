<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Thiết Bị Tủ Điện - De Heus</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; text-align: center; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, button { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background: #0056b3; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #004494; }
        .hidden { display: none; }
        .result-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; }
        .alert-red { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Audit Tủ Điện De Heus</h2>
    
    <div class="form-group">
        <label for="panelSelect">Chọn Mã Tủ Điện:</label>
        <select id="panelSelect" onchange="loadPanelData()">
            <option value="">-- Chọn tủ --</option>
            <option value="DB-10">Tủ DB-10</option>
            <option value="MSB-F1A">Tủ MSB-F1A</option>
        </select>
    </div>

    <div id="panelDetails" class="hidden">
        <div class="form-group">
            <p><strong>Khu vực:</strong> <span id="txtArea"></span></p>
            <p><strong>Bản vẽ:</strong> <a id="linkPdf" href="#" target="_blank">Xem Bản Vẽ PDF</a></p>
        </div>
        
        <div class="form-group">
            <label for="cameraInput">Chụp ảnh thực tế tủ điện:</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="previewAndUploadImage(event)">
        </div>
        
        <div id="loading" class="hidden" style="text-align: center; color: #0056b3;">Đang xử lý AI đối chiếu thiết bị...</div>
    </div>

    <div id="resultSection" class="hidden result-box">
        <h3>Kết quả Đối chiếu</h3>
        <p><strong>Trạng thái:</strong> <span id="txtStatus" class="alert-red"></span></p>
        <p><strong>Phát hiện lệch:</strong> <span id="txtDiscrepancy"></span></p>
        <p><a id="linkImage" href="#" target="_blank">Xem ảnh thực tế trên Drive</a></p>
    </div>
</div>

<script>
    // Thay thế bằng URL Web App khi deploy Google Apps Script
    const GAS_URL = "ĐIỀN_WEB_APP_URL_CỦA_APPS_SCRIPT";

    function loadPanelData() {
        const panelId = document.getElementById("panelSelect").value;
        if (!panelId) {
            document.getElementById("panelDetails").classList.add("hidden");
            return;
        }

        fetch(`${GAS_URL}?action=getPanelData&id=${panelId}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById("txtArea").innerText = data.panel.khuVuc;
                    document.getElementById("linkPdf").href = data.panel.linkPdf;
                    document.getElementById("panelDetails").classList.remove("hidden");
                } else {
                    alert(data.message);
                }
            })
            .catch(error => console.error("Lỗi kết nối:", error));
    }

    function previewAndUploadImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Image = e.target.result;
            const panelId = document.getElementById("panelSelect").value;
            
            document.getElementById("loading").classList.remove("hidden");

            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "verifyPanel",
                    panelId: panelId,
                    imagebase64: base64Image,
                    technician: "KTV_NguyenVanA"
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("loading").classList.add("hidden");
                if (data.status === "success") {
                    document.getElementById("txtStatus").innerText = data.safetyStatus;
                    document.getElementById("txtDiscrepancy").innerText = data.discrepancy;
                    document.getElementById("linkImage").href = data.imageUrl;
                    document.getElementById("resultSection").classList.remove("hidden");
                } else {
                    alert("Lỗi xử lý: " + data.message);
                }
            })
            .catch(error => {
                document.getElementById("loading").classList.add("hidden");
                console.error("Lỗi:", error);
            });
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
