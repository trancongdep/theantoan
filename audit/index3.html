                    laws: "QCVN 03:2011/BLĐTBXH; TCVN 3146:1986",

                }
            ]
        };

        document.addEventListener("DOMContentLoaded", function() {
            renderAllModules();
        });

        function renderAllModules() {
            for (const [modKey, items] of Object.entries(auditData)) {
                const container = document.getElementById(`list_${modKey}`);
                let html = "";
                items.forEach((item) => {
                    let badgeColor = item.defaultStatus === "Tuân thủ" ? "bg-success" : (item.defaultStatus === "Tuân thủ một phần" ? "bg-warning text-dark" : "bg-danger");
                    html += `
                        <div class="card card-criteria p-3" id="item_${item.code}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge badge-code me-1">${item.code}</span>
                                    <strong class="text-dark">${item.title}</strong>
                                </div>
                                <button class="btn btn-sm btn-outline-success" type="button" data-bs-toggle="collapse" data-bs-target="#collapse_${item.code.replace(/\./g, '_')}">
                                    <i class="fa-solid fa-chevron-down"></i> Chi tiết
                                </button>
                            </div>
                            <p class="small text-muted mt-2 mb-1">${item.desc}</p>
                            <div><span class="badge ${badgeColor} small">${item.defaultStatus}</span></div>

                            <!-- PHẦN THU GỌN / MỞ RỘNG CHI TIẾT & HÌNH ẢNH -->
                            <div class="collapse collapse-content p-2" id="collapse_${item.code.replace(/\./g, '_')}">
                                <div class="alert alert-light border small mb-2 p-2">
                                    <strong><i class="fa-solid fa-circle-info text-success me-1"></i>Biện pháp kỹ thuật & Hướng dẫn:</strong><br>
                                    ${item.detail}<br>
                                    <span class="text-success fst-italic">Căn cứ pháp lý: ${item.laws}</span>
                                </div>

                                <div class="row g-2 mb-2">
                                    <div class="col-6">
                                        <label class="form-label small fw-bold mb-1">Kết quả Audit:</label>
                                        <select class="form-select form-select-sm fw-bold result-select" data-code="${item.code}">
                                            <option value="Tuân thủ" ${item.defaultStatus === "Tuân thủ" ? "selected" : ""}>✔ TUÂN THỦ</option>
                                            <option value="Tuân thủ một phần" ${item.defaultStatus === "Tuân thủ một phần" ? "selected" : ""}>⚠ TUÂN THỦ MỘT PHẦN</option>
                                            <option value="Chưa tuân thủ" ${item.defaultStatus === "Chưa tuân thủ" ? "selected" : ""}>✖ CHƯA TUÂN THỦ</option>
                                            <option value="Không áp dụng">― N/A</option>
                                        </select>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small fw-bold mb-1">Mức độ rủi ro:</label>
                                        <select class="form-select form-select-sm risk-select" data-code="${item.code}">
                                            <option value="Cao (Nghiêm trọng)">CAO / NGHIÊM TRỌNG</option>
                                            <option value="Trung bình" selected>TRUNG BÌNH</option>
                                            <option value="Thấp">THẤP</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-2">
                                    <input type="text" class="form-control form-control-sm note-input" data-code="${item.code}" placeholder="Ghi chú hiện trường / Mô tả lỗi thực tế tại Heineken...">
                                </div>
                                <div class="mb-2">
                                    <input type="text" class="form-control form-control-sm capa-input" data-code="${item.code}" placeholder="Hành động khắc phục (CAPA) & Thời hạn hoàn thành...">
                                </div>

                                <!-- ẢNH CHỤP HIỆN TRƯỜNG (1-3 ẢNH) -->
                                <div class="d-flex gap-2 align-items-center mb-3">
                                    <small class="text-muted fw-bold">Ảnh (${item.code}):</small>
                                    <div class="img-preview-box" onclick="triggerFileInput('${item.code}', 1)">
                                        <i class="fa-solid fa-camera text-secondary" id="icon_${item.code.replace(/\./g, '_')}_1"></i>
                                        <img id="prev_${item.code.replace(/\./g, '_')}_1" class="d-none">
                                        <button type="button" class="remove-btn d-none" id="del_${item.code.replace(/\./g, '_')}_1" onclick="removeImage(event, '${item.code}', 1)">×</button>
                                    </div>
                                    <div class="img-preview-box" onclick="triggerFileInput('${item.code}', 2)">
                                        <i class="fa-solid fa-camera text-secondary" id="icon_${item.code.replace(/\./g, '_')}_2"></i>
                                        <img id="prev_${item.code.replace(/\./g, '_')}_2" class="d-none">
                                        <button type="button" class="remove-btn d-none" id="del_${item.code.replace(/\./g, '_')}_2" onclick="removeImage(event, '${item.code}', 2)">×</button>
                                    </div>
                                    <div class="img-preview-box" onclick="triggerFileInput('${item.code}', 3)">
                                        <i class="fa-solid fa-camera text-secondary" id="icon_${item.code.replace(/\./g, '_')}_3"></i>
                                        <img id="prev_${item.code.replace(/\./g, '_')}_3" class="d-none">
                                        <button type="button" class="remove-btn d-none" id="del_${item.code.replace(/\./g, '_')}_3" onclick="removeImage(event, '${item.code}', 3)">×</button>
                                    </div>
                                    <input type="file" accept="image/*" class="d-none" id="file_${item.code.replace(/\./g, '_')}_1" onchange="previewImage(this, '${item.code}', 1)">
                                    <input type="file" accept="image/*" class="d-none" id="file_${item.code.replace(/\./g, '_')}_2" onchange="previewImage(this, '${item.code}', 2)">
                                    <input type="file" accept="image/*" class="d-none" id="file_${item.code.replace(/\./g, '_')}_3" onchange="previewImage(this, '${item.code}', 3)">
                                </div>

                                <!-- NÚT LƯU RIÊNG CHO TỪNG MỤC -->
                                <div class="d-grid">
                                    <button class="btn btn-success btn-sm fw-bold" onclick="syncSingleItem('${item.code}', '${item.title.replace(/'/g, "")}')">
                                        <i class="fa-solid fa-cloud-arrow-up me-1"></i> Lưu & Đồng bộ mục ${item.code} ngay
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        function switchModule(val) {
            document.querySelectorAll('.audit-module').forEach(el => el.classList.add('d-none'));
            document.getElementById(`mod_${val}`).classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function triggerFileInput(code, index) {
            let safeCode = code.replace(/\./g, '_');
            document.getElementById(`file_${safeCode}_${index}`).click();
        }

        function previewImage(input, code, index) {
            let safeCode = code.replace(/\./g, '_');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const prev = document.getElementById(`prev_${safeCode}_${index}`);
                    const icon = document.getElementById(`icon_${safeCode}_${index}`);
                    const del = document.getElementById(`del_${safeCode}_${index}`);
                    
                    prev.src = e.target.result;
                    prev.classList.remove('d-none');
                    icon.classList.add('d-none');
                    del.classList.remove('d-none');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeImage(event, code, index) {
            event.stopPropagation();
            let safeCode = code.replace(/\./g, '_');
            document.getElementById(`file_${safeCode}_${index}`).value = "";
            const prev = document.getElementById(`prev_${safeCode}_${index}`);
            const icon = document.getElementById(`icon_${safeCode}_${index}`);
            const del = document.getElementById(`del_${safeCode}_${index}`);
            
            prev.src = "";
            prev.classList.add('d-none');
            icon.classList.remove('d-none');
            del.classList.add('d-none');
        }

        function getImageData(code, index) {
            let safeCode = code.replace(/\./g, '_');
            const prev = document.getElementById(`prev_${safeCode}_${index}`);
            return prev.classList.contains('d-none') ? "" : prev.src;
        }

        // HÀM ĐỒNG BỘ RIÊNG CHO TỪNG MỤC
        async function syncSingleItem(code, title) {
            const modal = new bootstrap.Modal(document.getElementById('loadingModal'));
            document.getElementById('loadingText').innerText = `Đang lưu mục ${code} lên Google Sheet & Drive...`;
            modal.show();

            const result = document.querySelector(`.result-select[data-code="${code}"]`).value;
            const risk = document.querySelector(`.risk-select[data-code="${code}"]`).value;
            const note = document.querySelector(`.note-input[data-code="${code}"]`).value;
            const capa = document.querySelector(`.capa-input[data-code="${code}"]`).value;
            const img1 = getImageData(code, 1);
            const img2 = getImageData(code, 2);
            const img3 = getImageData(code, 3);

            const payload = {
                code: code,
                content: title,
                result: result,
                note: note,
                risk: risk,
                capa: capa,
                image1: img1,
                image2: img2,
                image3: img3,
                auditor: "Trần Công Đẹp"
            };

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const resJson = await response.json();
                modal.hide();
                if (resJson.status === "success") {
                    alert(`✔ Đã lưu thành công mục [${code}] lên Google Sheet & Drive Heineken!`);
                } else {
                    alert("Lỗi từ server: " + resJson.message);
                }
            } catch (err) {
                modal.hide();
                alert("Lỗi kết nối mạng khi đồng bộ: " + err.toString());
            }
        }
    </script>
</body>
</html>
