    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8yiTe93CHFcXLriTcmkTzW07bnN2V5puCdhYXdLTqcBbUI5qauhJ7Juelciccbx482Q/exec";

        const auditData = {
            "211": [
                { code: "2.1.1.01", title: "Hành lang đường dây trên không", desc: "Không có công trình cơi nới vi phạm khoảng cách an toàn phóng điện, cây xanh được cắt tỉa an toàn.", detail: "Kiểm tra thực tế tuyến đường dây trung/hạ thế trong khuôn viên nhà máy. Đảm bảo khoảng cách ly pha-đất và pha-pha theo cấp điện áp. Cây xanh phải được cắt tỉa định kỳ, không để cành vướng vào đường dây khi có gió bão.", laws: "NĐ 62/2025/NĐ-CP - QCVN 25:2025/BCT" },
                { code: "2.1.1.02", title: "Cọc mốc và bảo vệ cáp ngầm", desc: "Có mốc báo hiệu cáp ngầm, không trồng cây rễ sâu hoặc đào bới trong hành lang bảo vệ cáp.", detail: "Kiểm tra các cọc mốc định vị tuyến cáp ngầm tại các điểm chuyển hướng, điểm đấu nối. Khu vực phía trên tuyến cáp không bị xe tải nặng chèn ép lún sụt hoặc tự ý đào bới xây dựng công trình.", laws: "NĐ 62/2025/NĐ-CP - 11 TCN 19-2006" },
                { code: "2.1.1.03", title: "An toàn Trạm biến áp & Phòng MSB", desc: "Tường rào, cửa khóa chắc chắn, lưới chắn chuột, hố thu dầu sự cố sạch sẽ không đọng nước.", detail: "Kiểm tra cửa phòng điện luôn khóa, mở ra ngoài. Các ô thông gió và rãnh cáp phải có lưới thép chống chuột bọ. Đối với MBA ngâm dầu, kiểm tra hố thu dầu sỏi đỡ sạch sẽ, không bị bít kín rác thải.", laws: "NĐ 62/2025/NĐ-CP - TT 02/2025/TT-BCT" },
                { code: "2.1.1.04", title: "Kiểm định thiết bị điện cao/trung thế", desc: "MBA, chống sét van, cáp ngầm có tem và giấy chứng nhận kiểm định định kỳ còn hạn.", detail: "Rà soát hồ sơ kiểm định kỹ thuật an toàn của tổ chức có chức năng đối với MBA, chống sét van, máy cắt trung thế. Đối chiếu số chế tạo (Serial) thực tế trên thiết bị với giấy chứng nhận.", laws: "Thông tư 02/2025/TT-BCT" },
                { code: "2.1.1.05", title: "Kiểm định dụng cụ an toàn điện", desc: "Sào, găng, ủng, thảm cách điện kiểm định định kỳ đúng hạn, cất giữ trong tủ chuyên dụng.", detail: "Kiểm tra tem kiểm định dán trên sào, găng tay, ủng và thảm cách điện. Găng/ủng định kỳ 6 tháng/lần; sào và bút thử điện định kỳ 12 tháng/lần. Bảo quản trong tủ khô ráo.", laws: "Thông tư 02/2025/TT-BCT" },
                { code: "2.1.1.06", title: "Nối đất an toàn vỏ thiết bị", desc: "Vỏ tủ điện, MBA, thang máng cáp nối đất chắc chắn; dây nối đất màu vàng - xanh chuẩn kỹ thuật.", detail: "Kiểm tra bu-lông tiếp địa vỏ máy, thanh cái PE trong tủ điện và dây đồng bện nối cánh tủ. Đo điện trở tiếp địa an toàn định kỳ hàng năm đảm bảo Rđ <= 4 Ohm.", laws: "TCVN 4756:1989 - QCVN 25:2025/BCT" },
                { code: "2.1.1.07", title: "Hệ thống chống sét & Cắt lọc sét", desc: "Kim thu sét, hộp kiểm tra tiếp địa nguyên vẹn; thiết bị cắt lọc sét (SPD) trong tủ MSB hoạt động tốt.", detail: "Kiểm tra kim thu sét trên mái, hộp kiểm tra điện trở tiếp địa (Test box) xung quanh xưởng. Kiểm tra đèn báo/cờ hiển thị trạng thái của thiết bị cắt lọc sét (SPD) trong tủ điện tổng.", laws: "TCVN 9385:2012" },
                { code: "2.1.1.08", title: "Bảo vệ quá dòng & Chống dòng rò", desc: "MCCB, MCB định mức phù hợp; tủ điện khu ẩm ướt có lắp thiết bị chống dòng rò (RCD/RCBO <= 30mA).", detail: "Đối chiếu dòng định mức của thiết bị đóng cắt với tiết diện dây dẫn. Kiểm tra nút Test trên các thiết bị chống dòng rò tại khu vực ẩm ướt để đảm bảo cơ cấu tác động nhạy.", laws: "TCVN 7447 - QCVN 25:2025/BCT" },
                { code: "2.1.1.09", title: "Che chắn tủ điện & Bịt kín lỗ cáp", desc: "Có tấm chắn mica bảo vệ chống chạm trực tiếp (IP2X), đáy tủ bịt kín chống chuột bọ xâm nhập.", detail: "Kiểm tra mặt nạ mica che các thanh cái (Busbar) bên trong tủ điện. Các lỗ luồn cáp dưới đáy tủ phải được chèn bịt kín bằng cao su hoặc đất sét chống cháy.", laws: "QCVN 25:2025/BCT" },
                { code: "2.1.1.10", title: "Biển báo an toàn điện & Sơ đồ", desc: "Có đầy đủ biển báo điện áp cao, cấm đóng điện tại TBA, tủ điện và sơ đồ đơn tuyến cập nhật thực tế.", detail: "Kiểm tra sự hiện diện của biển báo cấm, cảnh báo nguy hiểm điện áp trên cửa TBA và mặt tủ điện. Kiểm tra sơ đồ đơn tuyến gắn bên trong cánh cửa tủ phân phối.", laws: "Thông tư 02/2025/TT-BCT" }
            ],
            "212": [
                { code: "2.1.2.01", title: "Thẻ an toàn điện nhân sự", desc: "Nhân viên vận hành, sửa chữa điện được huấn luyện, sát hạch và cấp Thẻ an toàn điện đúng bậc.", detail: "Kiểm tra Thẻ an toàn điện của từng nhân sự bảo trì điện (Bậc 1 đến Bậc 5). Nội dung huấn luyện phải phù hợp với công việc và cấp điện áp thực tế quản lý.", laws: "Luật Điện lực 2024 - TT 02/2025/TT-BCT" },
                { code: "2.1.2.02", title: "Huấn luyện ATVSLĐ Nhóm 3", desc: "Nhân sự làm việc với điện có Thẻ ATVSLĐ Nhóm 3 còn hiệu lực (2 năm/lần).", detail: "Kiểm tra hồ sơ huấn luyện và Thẻ an toàn lao động Nhóm 3 đối với công việc làm việc với điện, làm việc trên cao theo đúng quy định định kỳ 2 năm.", laws: "Nghị định 44/2016/NĐ-CP - TT 06/2020/TT-BLĐTBXH" },
                { code: "2.1.2.03", title: "Chế độ Phiếu & Lệnh công tác", desc: "Công việc sửa chữa điện thực hiện nghiêm ngặt theo Phiếu công tác / Lệnh công tác và lưu trữ đầy đủ.", detail: "Kiểm tra tập lưu trữ Phiếu công tác và sổ ghi Lệnh công tác trong 6 tháng gần nhất. Rà soát chữ ký của các chức danh: Người cấp phiếu, Người chỉ huy, Người cho phép.", laws: "Thông tư 02/2025/TT-BCT" },
                { code: "2.1.2.04", title: "Quy trình LOTO & 5 bước kỹ thuật", desc: "Áp dụng khóa LOTO, thử không còn điện, đặt tiếp địa di động và treo biển cảnh báo trước khi sửa chữa.", detail: "Kiểm tra bộ dụng cụ khóa cô lập năng lượng (LOTO), bút thử điện, tiếp địa di động của đội bảo trì. Xác thực quy trình 5 bước kỹ thuật khi thao tác cắt điện.", laws: "QCVN 25:2025/BCT" },
                { code: "2.1.2.05", title: "Đi dây cáp nguồn máy sản xuất", desc: "Cáp điện đi trên máng hoặc ống bảo vệ chắc chắn, không vắt qua góc sắc nhọn hoặc ngâm trên sàn ướt.", detail: "Kiểm tra tuyến cáp cấp nguồn từ máng cáp xuống tủ điều khiển máy. Dây dẫn phải được luồn trong ống bảo vệ kín, không để trần trên sàn nhà xưởng ẩm ướt.", laws: "TCVN 7447-5-52" },
                { code: "2.1.2.06", title: "Ổ cắm, phích cắm công nghiệp & Hành lang", desc: "Sử dụng phích cắm chuẩn công nghiệp, dán nhãn 220V/380V, hành lang trước tủ điện thông thoáng >= 0.8m.", detail: "Kiểm tra loại ổ cắm/phích cắm công nghiệp có cực tiếp địa. Kiểm tra hành lang thao tác trước các tủ điện không bị xếp hàng hóa cản trở.", laws: "QCVN 25:2025/BCT" },
                { code: "2.1.2.07", title: "Nút dừng khẩn cấp (E-Stop) & Interlock", desc: "Nút E-Stop trên máy hoạt động tốt, các cửa che chắn có công tắc hành trình liên động ngắt điện.", detail: "Thử nghiệm thực tế nút nhấn E-Stop trên dây chuyền sản xuất. Kiểm tra công tắc hành trình (Interlock) tại các cửa che chắn nguy hiểm của máy.", laws: "TCVN 6719:2008 (ISO 13850)" },
                { code: "2.1.2.08", title: "An toàn khu vực ẩm ướt & Không gian hạn chế", desc: "Thiết bị điện khu nước thải/ngoài trời đạt chuẩn IP54+, dùng nguồn SELV (<=24V) khi bảo trì bồn bể.", detail: "Kiểm tra cấp bảo vệ IP của tủ điện, đèn chiếu sáng tại khu vực xử lý nước thải hoặc ngoài trời. Kiểm tra nguồn điện hạ áp an toàn (SELV 24V) dùng khi bảo trì bồn bể.", laws: "QCVN 34:2018/BLĐTBXH" },
                { code: "2.1.2.09", title: "Thiết bị điện phòng nổ & Chống tĩnh điện", desc: "Kho hóa chất/dung môi sử dụng thiết bị phòng nổ (Ex) và có kẹp tiếp địa tĩnh điện đầy đủ.", detail: "Kiểm tra nhãn thiết bị phòng nổ (Ex) tại kho hóa chất, trạm chiết rót dung môi. Kiểm tra hệ thống dây nối đẳng thế và kẹp tiếp địa tĩnh điện cho phuy chứa.", laws: "TCVN 10888 (IEC 60079)" },
                { code: "2.1.2.10", title: "Trang bị PPE & PCCC chuyên dụng điện", desc: "Thợ điện có giày/găng cách điện, quần áo chống hồ quang; trang bị bình CO2 và hướng dẫn sơ cứu điện giật.", detail: "Kiểm tra trang bị bảo hộ (giày, găng, mũ cách điện) của thợ điện. Kiểm tra bình chữa cháy khí CO2 đặt tại phòng điện và bảng hướng dẫn sơ cứu.", laws: "Thông tư 25/2022/TT-BLĐTBXH" }
            ],
            "213": [
                { code: "2.1.3.01", title: "Danh mục & Đo cách điện dụng cụ cầm tay", desc: "Dụng cụ (máy mài, khoan) có mã quản lý, đo điện trở cách điện định kỳ (>=2 MOhm) và dán tem Đạt.", detail: "Kiểm tra danh mục quản lý thiết bị cầm tay. Kiểm tra sổ đo điện trở cách điện định kỳ bằng mê-ga-ôm kế (đạt >= 2 MOhm với thiết bị Cấp I; >= 7 MOhm với Cấp II).", laws: "QCVN 25:2025/BCT - TCVN 7996" },
                { code: "2.1.3.02", title: "Phân cấp bảo vệ & Rulo chống dòng rò", desc: "Dụng cụ Cấp I/II được cắm qua tủ điện di động hoặc nguồn có tích hợp RCD/RCBO <= 30mA.", detail: "Kiểm tra nhãn phân cấp bảo vệ trên thân máy (Cấp I nối đất hoặc Cấp II cách điện kép). Kiểm tra các Rulo ổ cắm kéo dài phải tích hợp thiết bị chống dòng rò.", laws: "QCVN 25:2025/BCT" },
                { code: "2.1.3.03", title: "Tình trạng dây nguồn & Chuôi chống gập", desc: "Dây cáp mềm không nối thủ công, chuôi chống gập tại đuôi máy nguyên vẹn, phích cắm chắc chắn.", detail: "Kiểm tra dọc chiều dài dây nguồn dụng cụ cầm tay không có vết nối băng keo. Kiểm tra chuôi cao su chống gập tại đầu dây vào thân máy.", laws: "TCVN 7996-1:2009" },
                { code: "2.1.3.04", title: "Cơ cấu công tắc & Chụp bảo vệ đá mài", desc: "Công tắc nhạy, máy mài góc bắt buộc có chụp bảo vệ che chắn >= 180 độ và tay cầm phụ.", detail: "Kiểm tra công tắc đóng ngắt hoạt động tốt. Đối với máy mài góc, bắt buộc phải lắp chụp bảo vệ đá mài che chắn >= 180 độ và có tay cầm phụ.", laws: "TCVN 7996-1:2009" },
                { code: "2.1.3.05", title: "PPE & An toàn thao tác dụng cụ cầm tay", desc: "Công nhân đeo kính chống văng bắn, mặt nạ, giày bảo hộ và không dùng găng vải dễ cuốn.", detail: "Kiểm tra việc sử dụng kính bảo hộ, mặt nạ chống văng khi thao tác máy cắt/mài. Đảm bảo công nhân không đeo găng tay vải sợi dễ bị cuốn vào trục quay.", laws: "Nghị định 44/2016/NĐ-CP" }
            ],
            "214": [
                { code: "2.1.4.01", title: "Điện áp không tải máy hàn & Thiết bị VRD", desc: "Máy hàn có nắp che cọc đấu, dây nguồn <= 15m; tích hợp mạch giảm áp không tải (VRD) khi hàn ẩm ướt.", detail: "Kiểm tra nắp che an toàn tại cực đấu nối máy hàn. Đo điện áp không tải và kiểm tra tích hợp bộ giảm áp tự động VRD khi hàn trong môi trường ẩm ướt.", laws: "QCVN 03:2011/BLĐTBXH - TCVN 8524" },
                { code: "2.1.4.02", title: "Nối đất vỏ máy hàn và kẹp vật hàn", desc: "Vỏ máy hàn nối đất chắc chắn; cáp mát kẹp trực tiếp vào vật hàn, cấm dùng kết cấu nhà xưởng làm dây mát.", detail: "Kiểm tra dây nối đất vỏ máy hàn. Cáp mát phải được kẹp trực tiếp vào vật hàn bằng kẹp chuyên dụng, tuyệt đối không dùng kết cấu xưởng làm đường dẫn mát.", laws: "QCVN 03:2011/BLĐTBXH" },
                { code: "2.1.4.03", title: "An toàn cáp hàn và kìm hàn", desc: "Cáp hàn mềm bọc cao su không tróc vỏ, kìm hàn cách điện chịu nhiệt tốt, không vắt kìm lên bàn hàn.", detail: "Kiểm tra vỏ bọc cáp hàn không bị cháy sém, lộ lõi. Kìm hàn phải đảm bảo cách điện tốt, có giá treo cách điện khi ngưng sử dụng.", laws: "QCVN 03:2011/BLĐTBXH" },
                { code: "2.1.4.04", title: "Che chắn hồ quang, thông gió & Giấy phép lửa", desc: "Có rèm chắn hồ quang, chụp hút khói hàn; cách ly vật liệu cháy >= 10m hoặc lập Hot Work Permit.", detail: "Kiểm tra rèm chắn tia hồ quang quanh khu vực hàn cố định. Khoảng cách cách ly vật liệu dễ cháy >= 10m hoặc phải có Giấy phép làm việc sinh lửa.", laws: "QCVN 03:2011/BLĐTBXH - TCVN 3146" },
                { code: "2.1.4.05", title: "Chứng chỉ thợ hàn & PPE chuyên dụng", desc: "Thợ hàn có thẻ an toàn Nhóm 3, mặt nạ hàn lọc sáng chuẩn, găng tay da dài và tạp dề chống cháy.", detail: "Kiểm tra Thẻ an toàn Nhóm 3 của thợ hàn. Trang bị đầy đủ mặt nạ hàn lọc sáng, găng tay da chịu nhiệt, tạp dề da và giày bảo hộ chống cháy.", laws: "QCVN 03:2011/BLĐTBXH - TCVN 5083" }
            ]
        };

        document.addEventListener("DOMContentLoaded", function() {
            renderAllModules();
        });

        function renderAllModules() {
            for (const [modKey, items] of Object.entries(auditData)) {
                const container = document.getElementById(`list_${modKey}`);
                let html = "";
                items.forEach((item) => {
                    html += `
                        <div class="card card-criteria p-3" id="item_${item.code}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge badge-code me-1">${item.code}</span>
                                    <strong class="text-dark">${item.title}</strong>
                                </div>
                                <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapse_${item.code}">
                                    <i class="fa-solid fa-chevron-down"></i> Chi tiết
                                </button>
                            </div>
                            <p class="small text-muted mt-2 mb-1">${item.desc}</p>

                            <!-- PHẦN THU GỌN / MỞ RỘNG CHI TIẾT & HÌNH ẢNH -->
                            <div class="collapse collapse-content p-2" id="collapse_${item.code}">
                                <div class="alert alert-light border small mb-2 p-2">
                                    <strong><i class="fa-solid fa-circle-info text-primary me-1"></i>Hướng dẫn kiểm tra & Căn cứ:</strong><br>
                                    ${item.detail}<br>
                                    <span class="text-primary fst-italic">Pháp lý: ${item.laws}</span>
                                </div>

                                <div class="row g-2 mb-2">
                                    <div class="col-6">
                                        <label class="form-label small fw-bold mb-1">Kết quả:</label>
                                        <select class="form-select form-select-sm fw-bold result-select" data-code="${item.code}">
                                            <option value="Đạt" class="text-success">✔ ĐẠT</option>
                                            <option value="Không đạt" class="text-danger" selected>✖ KHÔNG ĐẠT</option>
                                            <option value="Không áp dụng">― N/A</option>
                                        </select>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small fw-bold mb-1">Mức độ rủi ro:</label>
                                        <select class="form-select form-select-sm risk-select" data-code="${item.code}">
                                            <option value="Cao (Nghiêm trọng)">CAO</option>
                                            <option value="Trung bình" selected>TRUNG BÌNH</option>
                                            <option value="Thấp">THẤP</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-2">
                                    <input type="text" class="form-control form-control-sm note-input" data-code="${item.code}" placeholder="Ghi chú hiện trường / Mô tả lỗi...">
                                </div>
                                <div class="mb-2">
                                    <input type="text" class="form-control form-control-sm capa-input" data-code="${item.code}" placeholder="Hành động khắc phục (CAPA) & Thời hạn...">
                                </div>

                                <!-- ẢNH CHỤP HIỆN TRƯỜNG (1-3 ẢNH) -->
                                <div class="d-flex gap-2 align-items-center mb-3">
                                    <small class="text-muted fw-bold">Ảnh (${item.code}):</small>
                                    <div class="img-preview-box" onclick="triggerFileInput('${item.code}', 1)">
                                        <i class="fa-solid fa-camera text-secondary" id="icon_${item.code}_1"></i>
                                        <img id="prev_${item.code}_1" class="d-none">
                                        <button type="button" class="remove-btn d-none" id="del_${item.code}_1" onclick="removeImage(event, '${item.code}', 1)">×</button>
                                    </div>
                                    <div class="img-preview-box" onclick="triggerFileInput('${item.code}', 2)">
                                        <i class="fa-solid fa-camera text-secondary" id="icon_${item.code}_2"></i>
                                        <img id="prev_${item.code}_2" class="d-none">
                                        <button type="button" class="remove-btn d-none" id="del_${item.code}_2" onclick="removeImage(event, '${item.code}', 2)">×</button>
                                    </div>
                                    <div class="img-preview-box" onclick="triggerFileInput('${item.code}', 3)">
                                        <i class="fa-solid fa-camera text-secondary" id="icon_${item.code}_3"></i>
                                        <img id="prev_${item.code}_3" class="d-none">
                                        <button type="button" class="remove-btn d-none" id="del_${item.code}_3" onclick="removeImage(event, '${item.code}', 3)">×</button>
                                    </div>
                                    <input type="file" accept="image/*" class="d-none" id="file_${item.code}_1" onchange="previewImage(this, '${item.code}', 1)">
                                    <input type="file" accept="image/*" class="d-none" id="file_${item.code}_2" onchange="previewImage(this, '${item.code}', 2)">
                                    <input type="file" accept="image/*" class="d-none" id="file_${item.code}_3" onchange="previewImage(this, '${item.code}', 3)">
                                </div>

                                <!-- NÚT LƯU RIÊNG CHO TỪNG MỤC -->
                                <div class="d-grid">
                                    <button class="btn btn-success btn-sm fw-bold" onclick="syncSingleItem('${item.code}', '${item.title.replace(/'/g, "")}')">
                                        <i class="fa-solid fa-cloud-arrow-up me-1"></i> Lưu & Đồng bộ mục này ngay
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        function switchModule(val) {
            document.querySelectorAll('.audit-module').forEach(el => el.classList.add('d-none'));
            document.getElementById(`mod_${val}`).classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function triggerFileInput(code, index) {
            document.getElementById(`file_${code}_${index}`).click();
        }

        function previewImage(input, code, index) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const prev = document.getElementById(`prev_${code}_${index}`);
                    const icon = document.getElementById(`icon_${code}_${index}`);
                    const del = document.getElementById(`del_${code}_${index}`);
                    
                    prev.src = e.target.result;
                    prev.classList.remove('d-none');
                    icon.classList.add('d-none');
                    del.classList.remove('d-none');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeImage(event, code, index) {
            event.stopPropagation();
            document.getElementById(`file_${code}_${index}`).value = "";
            const prev = document.getElementById(`prev_${code}_${index}`);
            const icon = document.getElementById(`icon_${code}_${index}`);
            const del = document.getElementById(`del_${code}_${index}`);
            
            prev.src = "";
            prev.classList.add('d-none');
            icon.classList.remove('d-none');
            del.classList.add('d-none');
        }

        function getImageData(code, index) {
            const prev = document.getElementById(`prev_${code}_${index}`);
            return prev.classList.contains('d-none') ? "" : prev.src;
        }

        // HÀM ĐỒNG BỘ RIÊNG CHO TỪNG MỤC
        async function syncSingleItem(code, title) {
            const modal = new bootstrap.Modal(document.getElementById('loadingModal'));
            document.getElementById('loadingText').innerText = `Đang lưu mục ${code} lên Google Sheet & Drive...`;
            modal.show();

            const result = document.querySelector(`.result-select[data-code="${code}"]`).value;
            const risk = document.querySelector(`.risk-select[data-code="${code}"]`).value;
            const note = document.querySelector(`.note-input[data-code="${code}"]`).value;
            const capa = document.querySelector(`.capa-input[data-code="${code}"]`).value;
            const img1 = getImageData(code, 1);
            const img2 = getImageData(code, 2);
            const img3 = getImageData(code, 3);

            const payload = {
                code: code,
                content: title,
                result: result,
                note: note,
                risk: risk,
                capa: capa,
                image1: img1,
                image2: img2,
                image3: img3,
                auditor: "Trần Công Đẹp"
            };

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const resJson = await response.json();
                modal.hide();
                if (resJson.status === "success") {
                    alert(`✔ Đã lưu thành công mục [${code}] lên Google Sheet & Drive!`);
                } else {
                    alert("Lỗi từ server: " + resJson.message);
                }
            } catch (err) {
                modal.hide();
                alert("Lỗi kết nối mạng khi đồng bộ: " + err.toString());
            }
        }
    </script>
</body>
</html>
