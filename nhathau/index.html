<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Hệ thống Quản lý An toàn Nhà thầu (CSMS)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { border-radius: 12px; border: none; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card login-card p-4">
          <div class="text-center mb-4">
            <i class="fas fa-shield-alt fa-3x text-primary mb-2"></i>
            <h4 class="fw-bold text-dark">CSMS PORTAL</h4>
            <p class="text-muted small">Hệ thống Quản lý An toàn Nhà thầu & Giấy phép làm việc</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email hoặc Số CCCD / Mã NV</label>
              <input type="text" id="loginId" class="form-control" placeholder="Nhập email hoặc số CCCD..." required>
              <div class="form-text">Nếu đăng nhập bằng CCCD, hệ thống tự động ánh xạ sang định danh nội bộ.</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Mật khẩu</label>
              <input type="password" id="loginPass" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">
              <i class="fas fa-sign-in-alt me-2"></i>ĐĂNG NHẬP HỆ THỐNG
            </button>
          </form>

          <div class="text-center text-muted small mb-3">— HOẶC DÀNH CHO CÁN BỘ NỘI BỘ —</div>

          <button id="btnGoogleLogin" class="btn btn-outline-danger w-100 fw-semibold py-2">
            <i class="fab fa-google me-2"></i>Đăng nhập bằng Google
          </button>
          <div id="loginError" class="alert alert-danger mt-3 d-none small"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    // Chuyển hướng nếu đã đăng nhập
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = "config.html"; // Sẽ đổi sang dashboard.html khi hoàn thiện
    });

    // Đăng nhập Email / CCCD
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("loginError");
      errBox.classList.add("d-none");

      let rawId = document.getElementById("loginId").value.trim();
      const pass = document.getElementById("loginPass").value;
      // Nếu nhà thầu nhập CCCD (không có @), tự động nối đuôi @csms.local để dùng Firebase Auth
      const email = rawId.includes("@") ? rawId : `${rawId}@csms.local`;

      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        errBox.textContent = "Sai thông tin đăng nhập hoặc mật khẩu: " + err.message;
        errBox.classList.remove("d-none");
      }
    });

    // Đăng nhập Google
    document.getElementById("btnGoogleLogin").addEventListener("click", async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (err) {
        const errBox = document.getElementById("loginError");
        errBox.textContent = "Lỗi đăng nhập Google: " + err.message;
        errBox.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
